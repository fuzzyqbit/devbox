# Layer Configuration
# Toggle layers on/off to customize the image build.
# To add a new layer: create ansible/roles/<name>/, then add it here.

layers:
  base: true
  # persistent_home installs the boot-time mount of the separate /home EBS volume
  # (Terraform aws_ebs_volume.home) so user data survives AMI swaps. Pair with the
  # Terraform volume — leaving one without the other is a no-op / ephemeral-home warning.
  persistent_home: true
  certs: true
  python: true
  # secrets role is auto-gated by vscode/desktop; this flag is informational.
  secrets: true
  golang: true
  rust: true
  java: true
  containers: true
  terraform: true
  devops: true
  vscode: true
  git: true
  devtools: true
  # ai_tools bakes the agentic AI coding CLIs (claude, codex, opencode) as pinned
  # npm globals — no auth baked, operators log in at runtime.
  ai_tools: true
  # kion bakes the kion-creds STAK fetcher (login-prompted AWS creds via Kion).
  # Off by default: requires the org-specific kion_url extra-var to be set.
  kion: false
  desktop: true
  # vscode_desktop gates the Microsoft VS Code editor block inside the desktop role
  # (distinct from `vscode`, which is the browser code-server). Only applies when desktop is on.
  vscode_desktop: true
  # dcv gates the Phase 13 install/config/service block; co-deploys with the GNOME desktop.
  dcv: true
  # xrdp gates the SPAL xrdp install/config/service block (RDP :3389); co-deploys with the
  # GNOME desktop; ADDITIVE to dcv (a second, WebGL-free remote-desktop path).
  xrdp: true
  hardening: true
