# Layer Configuration
# Toggle layers on/off to customize the image build.
# To add a new layer: create ansible/roles/<name>/, then add it here.

layers:
  base: true
  certs: true
  python: true
  # secrets role is auto-gated by vscode/desktop; this flag is informational.
  secrets: true
  golang: true
  rust: true
  java: true
  containers: true
  terraform: true
  devops: true
  vscode: true
  git: true
  devtools: true
  desktop: true
  # vscode_desktop gates the Microsoft VS Code editor block inside the desktop role
  # (distinct from `vscode`, which is the browser code-server). Only applies when desktop is on.
  vscode_desktop: true
  # dcv gates the Phase 13 install/config/service block; co-deploys with the GNOME desktop.
  dcv: true
  hardening: true
