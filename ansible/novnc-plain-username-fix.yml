---
# FIXME: noVNC VeNCrypt-Plain username injection workaround.
#
# Symptom this addresses:
#   The desktop role runs TigerVNC with `-SecurityTypes Plain -PlainUsers ec2-user`
#   (ansible/roles/desktop/templates/vncserver.service.j2). VeNCrypt "Plain"
#   authenticates USERNAME + PASSWORD against PAM (/etc/pam.d/vnc). The stock noVNC
#   web client (v1.5.0, served from /usr/local/share/noVNC/index.html) DOES render a
#   username field for Plain, but operators reaching :6080 in a browser type only the
#   password and leave username blank — so noVNC submits an empty username, PAM
#   rejects it, and the (correct) VNC password appears "not to work".
#   Confirmed against noVNC v1.5.0 source: core/rfb.js fires `credentialsrequired`
#   with types ["username","password"] for Plain and transmits both to PAM;
#   app/ui.js `setCredentials` reads #noVNC_username_input verbatim.
#
# Why this is a workaround, not the design:
#   The box is single-user (dev_user = ec2-user), so the VNC username is a constant.
#   The clean answers are one of:
#     (a) noVNC gains a built-in username default / URL param for VeNCrypt Plain, so
#         the served page needs no patching.
#     (b) The desktop role moves off SecurityTypes=Plain to a password-only RFB
#         security type the stock noVNC UI drives natively (e.g. VncAuth — but that
#         re-introduces the 8-char DES truncation Plain was adopted to escape).
#   Until then, this play pre-fills the constant username into the served client and
#   hides the field, so the operator enters only the password (matching expectation).
#
# How:
#   Append a <style> + <script> to /usr/local/share/noVNC/index.html that sets
#   #noVNC_username_input.value = "{{ dev_user }}" at load and force-hides
#   #noVNC_username_block (the UI un-hides it for Plain; !important keeps it hidden,
#   the value is still submitted). Idempotent via blockinfile markers.
#
# This play assumes the `desktop` layer ran in the main playbook (which installs
# noVNC and copies vnc.html -> index.html). Skip it otherwise.
#
# Retirement criteria — this play SHOULD be deleted when ANY of:
#   (1) The desktop role stops using SecurityTypes=Plain for VNC. No Plain -> no
#       username step -> no injection needed.
#   (2) noVNC ships a username default/URL-param for VeNCrypt Plain that we adopt.
#   (3) The devbox becomes multi-user (username no longer constant) — at which point
#       operators must enter their own username and this pre-fill is wrong.
#
# Verification of retirement (and of this fix): after `./run build` + redeploy, the
# browser noVNC client at https://<host>:6080 shows only a password prompt, and
# logging in with the `./run secrets-show` VNC password succeeds.
#
# Cross-reference: CLAUDE.md Troubleshooting; root-caused 2026-06-15.

- name: noVNC VeNCrypt-Plain username injection (workaround)
  hosts: all
  become: true
  vars:
    dev_user: ec2-user  # mirrors ansible/playbook.yml + desktop role default
    novnc_index: /usr/local/share/noVNC/index.html
  tasks:
    - name: Skip if desktop layer is disabled
      meta: end_play
      when: not (layers.desktop | default(false))

    - name: Confirm the served noVNC client exists
      ansible.builtin.stat:
        path: "{{ novnc_index }}"
      register: novnc_index_stat

    - name: Fail if noVNC client is missing despite desktop layer enabled
      ansible.builtin.fail:
        msg: >-
          {{ novnc_index }} not found, but the desktop layer is enabled. The desktop
          role should have copied vnc.html -> index.html. Investigate before baking.
      when: not novnc_index_stat.stat.exists

    - name: Inject fixed VNC username into the noVNC client (VeNCrypt Plain workaround)
      ansible.builtin.blockinfile:
        path: "{{ novnc_index }}"
        marker: "<!-- {mark} ANSIBLE MANAGED: novnc plain-username fix -->"
        insertbefore: "</body>"
        block: |
          <style>#noVNC_username_block{display:none !important;}</style>
          <script>
            // VeNCrypt Plain needs a username; this devbox is single-user.
            // Pre-fill it and hide the field so the operator enters only the password.
            document.addEventListener('DOMContentLoaded', function () {
              var u = document.getElementById('noVNC_username_input');
              if (u) { u.value = '{{ dev_user }}'; }
            });
          </script>
