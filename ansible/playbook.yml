---
- name: Build development sandbox image
  hosts: all
  become: true
  vars:
    dev_user: ec2-user
    dev_home: /home/ec2-user

  pre_tasks:
    - name: Wait for cloud-init to finish
      command: cloud-init status --wait
      changed_when: false

  roles:
    - role: base
      when: layers.base | default(true)

    - role: certs
      when: layers.certs | default(true)

    - role: git
      when: layers.git | default(false)

    - role: python
      when: layers.python | default(false)

    - role: golang
      when: layers.golang | default(false)

    - role: rust
      when: layers.rust | default(false)

    - role: java
      when: layers.java | default(false)

    - role: containers
      when: layers.containers | default(false)

    - role: terraform
      when: layers.terraform | default(false)

    - role: devops
      when: layers.devops | default(false)

    - role: devtools
      when: layers.devtools | default(false)

    - role: secrets
      when: >-
        (layers.vscode | default(false)) or
        (layers.desktop | default(false))

    - role: vscode
      when: layers.vscode | default(false)

    - role: desktop
      when: layers.desktop | default(false)

    - role: xrdp
      when: (layers.xrdp | default(false)) and (layers.desktop | default(false))
      # xrdp config + service (Phase 11 RDP-08); MUST stay before hardening.
      # Gated on desktop too: xrdp needs GNOME (desktop role) + the ec2-user password
      # (secrets role, gated on vscode OR desktop), so both must exist before xrdp configures auth.

    - role: dcv
      when: (layers.dcv | default(false)) and (layers.desktop | default(false))
      # dcv config + service (Phase 13 DCV-04); MUST stay before hardening (hardening-last invariant).
      # Gated on desktop too: DCV needs GNOME (desktop role) + the ec2-user PAM password
      # (secrets role, gated on vscode OR desktop), so both must exist before dcv configures auth.

    - role: hardening  # MUST remain last — invariant (JUP-08 / CLAUDE.md §8)
      when: layers.hardening | default(false)

  post_tasks:
    # --- W1: regression-proof X-server guard — runs AFTER all roles, incl. hardening ---
    # The in-role RDP-13 assert runs before hardening, so it cannot catch CIS rule 2.2.1
    # deleting /usr/libexec/Xorg AFTER the xrdp role configured it. post_tasks run after every
    # role, so this is the one place a CIS-deleted X server is observable. Gated on the SAME
    # condition as the xrdp role so a no-xrdp bake does not fail on an X server it never installed.
    - name: Stat /usr/libexec/Xorg after hardening (W1 regression guard)
      stat:
        path: /usr/libexec/Xorg
      register: xserver_post_hardening
      when: (layers.xrdp | default(false)) and (layers.desktop | default(false))

    - name: Assert the X server survived the hardening role (W1 regression guard)
      ansible.builtin.assert:
        that:
          - xserver_post_hardening.stat.exists
        fail_msg: >-
          /usr/libexec/Xorg was DELETED after the xrdp role configured it — the X server is
          gone post-hardening. The most likely cause is CIS rule 2.2.1 being re-enabled on a
          CIS-role bump (it removes xorg-x11-server-common, a dependency of xorg-x11-server-Xorg).
          The fix is `amzn2023cis_rule_2_2_1: false` in ansible/roles/hardening/defaults/main.yml.
        quiet: false
      when: (layers.xrdp | default(false)) and (layers.desktop | default(false))

    - name: Clean dnf cache
      command: dnf clean all
      changed_when: false

    - name: Remove temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/*.tar.gz
        - /tmp/*.zip
        - /var/tmp/*

    - name: Write build manifest
      copy:
        content: |
          build_date: {{ ansible_date_time.iso8601 }}
          layers: {{ layers | to_nice_yaml }}
        dest: /etc/devimage-manifest.yml
        mode: "0644"

# FIXME: see firewalld-docker-fix.yml header — temporary workaround,
# not the long-term firewall design. Remove once firewalld policy is
# managed properly (or once firewalld is removed entirely).
- import_playbook: firewalld-docker-fix.yml
