---
- name: Build development sandbox image
  hosts: all
  become: true
  vars:
    dev_user: ec2-user
    dev_home: /home/ec2-user

  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

  roles:
    - role: base
      when: layers.base | default(true)

    - role: persistent-home
      when: layers.persistent_home | default(true)
      # Installs the boot-time mount of the separate /home EBS volume so user data
      # survives AMI swaps (Terraform aws_ebs_volume.home). Bake-time install only;
      # the mount runs at instance boot. Must stay before hardening (invariant).

    - role: certs
      when: layers.certs | default(true)

    - role: git
      when: layers.git | default(false)

    - role: python
      when: layers.python | default(false)

    - role: golang
      when: layers.golang | default(false)

    - role: rust
      when: layers.rust | default(false)

    - role: java
      when: layers.java | default(false)

    - role: containers
      when: layers.containers | default(false)

    - role: terraform
      when: layers.terraform | default(false)

    - role: devops
      when: layers.devops | default(false)

    - role: devtools
      when: layers.devtools | default(false)

    - role: secrets
      when: >-
        (layers.vscode | default(false)) or
        (layers.desktop | default(false))

    - role: vscode
      when: layers.vscode | default(false)

    - role: desktop
      when: layers.desktop | default(false)

    - role: dcv
      when: (layers.dcv | default(false)) and (layers.desktop | default(false))
      # dcv config + service (Phase 13 DCV-04); MUST stay before hardening (hardening-last invariant).
      # Gated on desktop too: DCV needs GNOME (desktop role) + the ec2-user PAM password
      # (secrets role, gated on vscode OR desktop), so both must exist before dcv configures auth.

    - role: xrdp
      when: (layers.xrdp | default(false)) and (layers.desktop | default(false))
      # xrdp (RDP :3389) from SPAL — a second, WebGL-free remote-desktop path, ADDITIVE to dcv
      # (quick-task 260707-o7s). MUST stay before hardening (hardening-last invariant). Gated on
      # desktop too: xrdp needs GNOME (desktop role) + the ec2-user PAM password (secrets role,
      # gated on vscode OR desktop), so both must exist before xrdp configures PAM auth.

    - role: hardening # MUST remain last — invariant (JUP-08 / CLAUDE.md §8)
      when: layers.hardening | default(false)

  post_tasks:
    # --- W1: regression-proof X-server guard — runs AFTER all roles, incl. hardening ---
    # The in-role DCV bake-assert runs before hardening, so it cannot catch CIS rule 2.2.1
    # deleting /usr/bin/Xdcv (DCV's bundled X server, from nice-xdcv) AFTER the dcv role
    # configured it. post_tasks run after every role, so this is the one place a CIS-deleted
    # X server is observable. Gated on the SAME condition as the dcv role so a no-dcv bake does
    # not fail on an X server it never installed.
    - name: Stat /usr/bin/Xdcv after hardening (W1 regression guard)
      ansible.builtin.stat:
        path: /usr/bin/Xdcv
      register: xserver_post_hardening
      when: (layers.dcv | default(false)) and (layers.desktop | default(false))

    - name: Assert the X server survived the hardening role (W1 regression guard)
      ansible.builtin.assert:
        that:
          - xserver_post_hardening.stat.exists
        fail_msg: >-
          /usr/bin/Xdcv was DELETED after the dcv role configured it — the DCV X server is
          gone post-hardening. Most likely cause: CIS 2.2.1 (now re-enabled) removed
          xorg-x11-server-common, and Xdcv or the GNOME-on-Xorg virtual session depended on it.
          If this fires, re-add amzn2023cis_rule_2_2_1: false to
          ansible/roles/hardening/defaults/main.yml and confirm `rpm -qR nice-xdcv` /
          `repoquery --requires nice-xdcv` at the Phase-15 UAT.
        quiet: false
      when: (layers.dcv | default(false)) and (layers.desktop | default(false))

    # --- W1b: xrdp Xorg-backend survival guard — runs AFTER all roles, incl. hardening ---
    # xorgxrdp's backend runs the SYSTEM Xorg (/usr/bin/Xorg from xorg-x11-server-Xorg). CIS 2.2.1
    # is scoped OFF for xrdp builds (hardening/defaults) so hardening must NOT strip it; this is
    # the one place a post-hardening removal is observable. Gated on the SAME condition as the
    # xrdp role so a no-xrdp bake does not fail on an X server it never installed.
    - name: Stat /usr/bin/Xorg after hardening (W1b — xrdp backend guard)
      ansible.builtin.stat:
        path: /usr/bin/Xorg
      register: xorg_post_hardening
      when: (layers.xrdp | default(false)) and (layers.desktop | default(false))

    - name: Assert the system Xorg survived hardening for the xrdp backend (W1b)
      ansible.builtin.assert:
        that:
          - xorg_post_hardening.stat.exists
        fail_msg: >-
          /usr/bin/Xorg is GONE post-hardening on an xrdp build. xorgxrdp's backend needs the
          system Xorg, so CIS 2.2.1 (which removes xorg-x11-server-common) MUST be scoped off when
          the xrdp layer is enabled. Confirm ansible/roles/hardening/defaults/main.yml sets
          amzn2023cis_rule_2_2_1 to false for xrdp builds. Without the system Xorg, xorgxrdp
          cannot start and every RDP session fails.
        quiet: false
      when: (layers.xrdp | default(false)) and (layers.desktop | default(false))

    - name: Clean dnf cache
      ansible.builtin.command: dnf clean all
      changed_when: false

    - name: Remove temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/*.tar.gz
        - /tmp/*.zip
        - /var/tmp/*

    - name: Write build manifest
      ansible.builtin.copy:
        content: |
          build_date: {{ ansible_date_time.iso8601 }}
          layers: {{ layers | to_nice_yaml }}
        dest: /etc/devimage-manifest.yml
        mode: "0644"

# FIXME: see firewalld-docker-fix.yml header — temporary workaround,
# not the long-term firewall design. Remove once firewalld policy is
# managed properly (or once firewalld is removed entirely).
- name: Apply the firewalld/docker workaround (see firewalld-docker-fix.yml header)
  import_playbook: firewalld-docker-fix.yml
