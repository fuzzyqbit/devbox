---
# FIXME: firewalld + Docker integration workaround.
#
# Symptom this addresses:
#   With firewalld active and the default zone = `public`, host services
#   (code-server :8080, DCV :8443) bound to 0.0.0.0 are dropped at INPUT
#   despite the AWS SG allowing them. Setting the default zone to `docker`
#   (target=ACCEPT) effectively makes firewalld permissive on the host
#   while keeping it installed for CIS compliance scans.
#
# Why this is a workaround, not the design:
#   The right answer is one of:
#     (a) Pin docker0 to the `docker` zone explicitly, leave default=public,
#         and add per-port allowances in `public` for the services we expose.
#     (b) Keep firewalld stopped/uninstalled and rely solely on EC2 SGs
#         (matches the comment in roles/hardening/defaults/main.yml:4).
#   Until that decision is made, this play makes behavior deterministic.
#
# Order matters:
#   Docker registers the `docker` firewalld zone at dockerd startup *only if*
#   firewalld was already running. So: install/start firewalld, restart
#   docker so it registers the zone, then set the zone as default.
#
# This play assumes the `containers` layer ran in the main playbook. Skip
# it otherwise (no docker → no `docker` zone → set-default-zone fails).
#
# Retirement criteria — this play SHOULD be deleted when ANY of:
#   (1) The CIS scan requirement that demands `firewalld present and running`
#       is lifted from this project's hardening posture. Today, the AL2023 CIS
#       role's defaults (ansible/roles/AMAZON2023-CIS/defaults/) require firewalld
#       to be installed. If a future CIS profile relaxes this, OR we switch to a
#       different hardening baseline (e.g., DISA STIG), this workaround is moot —
#       remove firewalld entirely and rely on the EC2 SG. This matches the comment
#       at ansible/roles/hardening/defaults/main.yml lines 4-13.
#
#   (2) The `containers` layer is removed from `ansible/layer_config.yml`. Without
#       Docker, no `docker` zone is registered, the default-zone-to-docker rewrite
#       is moot, and the host can stay on the stock `public` zone. Remove this play.
#
#   (3) Per-port allowances are added to the `public` zone (option (a) from line
#       14 above) inside the `roles/hardening` role itself — e.g., a
#       firewalld_port: list iterated over with the firewalld module. Once those
#       are in place, this workaround is redundant; delete it.
#
# Verification of retirement: after removing this play, `./run build` must
# succeed and the resulting AMI's `firewall-cmd --get-default-zone` must be
# either `public` (option a) or the firewalld package must be absent (option b).
# Either is acceptable; the workaround state (default zone = docker) is NOT.
#
# Cross-reference: CLAUDE.md Troubleshooting → "firewalld blocking ports inside
# the AMI" mentions this header as the canonical explanation.

- name: firewalld default zone = docker (workaround)
  hosts: all
  become: true
  tasks:
    - name: Skip if containers layer is disabled
      meta: end_play
      when: not (layers.containers | default(false))

    - name: Install firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
      register: firewalld_state

    - name: Restart docker so it registers the firewalld docker zone
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when: firewalld_state.changed

    - name: Get current firewalld default zone
      ansible.builtin.command: firewall-cmd --get-default-zone
      register: firewalld_default_zone
      changed_when: false

    - name: Set firewalld default zone to docker
      ansible.builtin.command: firewall-cmd --set-default-zone=docker
      when: firewalld_default_zone.stdout != "docker"
