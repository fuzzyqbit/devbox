---
# xrdp + xorgxrdp from-source build role — pinned versions + sha256 integrity
# Pattern: mirrors ansible/roles/devops/defaults/main.yml (mise pin convention)
#
# [VERIFIED: github.com/neutrinolabs/xrdp releases + sha256sum computed 2026-06-15]
# xrdp 0.10.6 — released 2026-04-17 (latest stable in the 0.10.x series)
xrdp_version: "0.10.6"
xrdp_checksum_sha256: "dfc21d5d603b642cf583987b36706b685bf05fd3aaaaacefb8f57c5f4a448677"

# [VERIFIED: github.com/neutrinolabs/xorgxrdp releases + sha256sum computed 2026-06-15]
# xorgxrdp 0.10.5 — released 2026-01-28; requires xrdp >= 0.10.2 (satisfied by 0.10.6)
xorgxrdp_version: "0.10.5"
xorgxrdp_checksum_sha256: "a5d03435f0ef48bf3d5010e63d9264f2334e7063cba3ecd8d4c0a15616a4f712"

# Configurable base URL for tarball downloads (RDP-01 airgap override).
# Default: official neutrinolabs GitHub releases.
# Override for true-airgap bakes: set xrdp_source_base_url to an internal mirror
# that serves identically-named tarballs. The sha256 checksum: pin is enforced
# regardless of base URL, so a mirror cannot serve substituted bytes.
# Per-package URLs are built as:
#   {{ xrdp_source_base_url }}/xrdp/releases/download/v{{ xrdp_version }}/xrdp-{{ xrdp_version }}.tar.gz
#   {{ xrdp_source_base_url }}/xorgxrdp/releases/download/v{{ xorgxrdp_version }}/xorgxrdp-{{ xorgxrdp_version }}.tar.gz
xrdp_source_base_url: "https://github.com/neutrinolabs"

dev_user: ec2-user
dev_home: /home/ec2-user

# --- Phase 11 runtime deps (RDP-05/07) — installed via dnf from the AL2023 core repo ---
# Airgap policy (CLAUDE.md §2 / RESEARCH C2): both packages live in the AL2023 core dnf
# repos. Install via ansible.builtin.dnf only — NO S3, NO private mirror, NO new get_url.
xrdp_runtime_deps:
  - xorg-x11-server-Xorg          # provides /usr/libexec/Xorg, the X server referenced by sesman.ini [Xorg] param (AL2023-core)
  - dbus-x11                      # provides dbus-launch, called by startwm.sh to start the GNOME session (AL2023-core)
  - policycoreutils-python-utils  # provides `semanage`, used to add the xrdp_exec_t fcontext for /usr/local/sbin/xrdp(-sesman) (AL2023-core; airgap=dnf)
