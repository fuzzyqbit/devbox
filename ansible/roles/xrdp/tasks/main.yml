---
# xrdp role — SPAL-sourced xrdp + xorgxrdp remote-desktop path (:3389), ADDITIVE alongside DCV.
# Mirrors the dcv role: secrets-reuse assert -> SPAL enable -> version-pinned install -> PAM +
# startwm + TLS-hardened xrdp.ini -> service enable -> SELinux relabel -> static bake asserts.
# Wires before `hardening` (invariant C1); the runtime/adversarial half is the Task 3 human-verify.

- name: Assert the dev_user PAM password was set by the secrets role (XRDP-02)
  # Ported verbatim from dcv/tasks/main.yml — xrdp authenticates ec2-user through PAM against
  # the SAME desktop_password the secrets pipeline generates/publishes/applies. No new secret.
  ansible.builtin.assert:
    that:
      - desktop_password is defined
      - desktop_password | length > 0
    fail_msg: >-
      desktop_password is not set. Did the `secrets` role run before `xrdp`?
      The xrdp role authenticates ec2-user via /etc/pam.d/xrdp-sesman -> password-auth,
      which relies on the dev_user PAM password the secrets pipeline generates/publishes/applies.
      Check ansible/playbook.yml role ordering and the layers.desktop / layers.xrdp flags.
    quiet: true
  no_log: true

# --- SPAL version floor (XRDP-01) — assert FIRST with a readable fail_msg ---
# SPAL requires system-release >= xrdp_spal_min_system_release. Older AMIs have no spal-release
# package, so `dnf install spal-release` fails cryptically. Gate on the actual installed
# system-release VERSION (from package_facts), which carries the dotted-numeric date form
# AL2023 uses (e.g. 2023.9.20251117).

- name: Gather installed package facts for the SPAL system-release floor gate (XRDP-01)
  ansible.builtin.package_facts:
    manager: auto

- name: Assert the AL2023 system-release meets the SPAL version floor (XRDP-01)
  ansible.builtin.assert:
    that:
      - ansible_facts.packages['system-release'][0].version is version(xrdp_spal_min_system_release, '>=', version_type='loose')
    fail_msg: >-
      This AMI's system-release
      ({{ ansible_facts.packages['system-release'][0].version | default('absent') }}) is BELOW
      the SPAL floor ({{ xrdp_spal_min_system_release }}). SPAL (Supplementary Packages for
      Amazon Linux) is only available on AL2023 >= {{ xrdp_spal_min_system_release }}; older
      images have no `spal-release` package and `dnf install spal-release` fails cryptically.
      Rebake from a newer AL2023 source AMI (or `sudo dnf upgrade` the base) and retry.
      https://docs.aws.amazon.com/linux/al2023/ug/configure-spal-repository.html
    quiet: true

# --- Enable SPAL (XRDP-01) via the Amazon-signed spal-release package ---
# `dnf install spal-release` drops /etc/yum.repos.d/amazonlinux-spal.repo AND imports the SPAL
# GPG keys — the canonical SPAL-enable mechanism. This delivers the "SPAL repo file under
# /etc/yum.repos.d/" the locked decision requires, using the Amazon-signed release package
# (avoids a drift-prone hand-hardcoded baseurl/GPG key). GPG check stays ON (no --nogpgcheck;
# CLAUDE.md §8 airgap posture) for spal-release AND every dnf install below.

- name: Enable SPAL via the Amazon-signed spal-release package (XRDP-01)
  ansible.builtin.dnf:
    name: spal-release
    state: present
    disable_gpg_check: false

# --- System Xorg server (xorgxrdp backend dependency, AL2023 core repo) ---
# xorgxrdp's Xorg backend runs the SYSTEM Xorg (/usr/bin/Xorg from xorg-x11-server-Xorg). Install
# it explicitly so the dependency is first-class, not merely transitive via xorgxrdp. The
# re-enabled CIS 2.2.1 (which removes xorg-x11-server-common) is scoped OFF for xrdp builds in
# ansible/roles/hardening/defaults/main.yml so hardening does not strip it back out.
- name: Install the system Xorg server for the xorgxrdp backend (XRDP-01)
  ansible.builtin.dnf:
    name: xorg-x11-server-Xorg
    state: present
    disable_gpg_check: false

# --- Install xrdp + xorgxrdp from SPAL (XRDP-01) ---
# SPAL is an EPEL9 rebuild; xrdp/xorgxrdp are EPEL9 packages, expected present. The SPAL GPG
# key was imported by spal-release, so disable_gpg_check stays false. Version pin applied when
# xrdp_version / xorgxrdp_version are set (deferred-pin); bare names install the latest in the
# versioned SPAL repo until pinned at first bake. Confirm availability at exec with
# `dnf list --repo=amazonlinux-spal xrdp xorgxrdp`.

- name: Install xrdp + xorgxrdp from the SPAL repo (XRDP-01)
  ansible.builtin.dnf:
    name:
      - "xrdp{{ ('-' ~ xrdp_version) if (xrdp_version | length > 0) else '' }}"
      - "xorgxrdp{{ ('-' ~ xrdp_xorgxrdp_version) if (xrdp_xorgxrdp_version | length > 0) else '' }}"
    state: present
    disable_gpg_check: false
  register: xrdp_pkg_install

# --- PAM delegation (XRDP-02) — /etc/pam.d/xrdp-sesman -> password-auth ---
# Verifies/repairs the PAM path for AL2023 regardless of the SPAL xrdp RPM default, and inherits
# the CIS faillock + pwquality stack. ec2-user logs in with the existing desktop password.

- name: Install /etc/pam.d/xrdp-sesman delegating to password-auth (XRDP-02)
  ansible.builtin.copy:
    src: xrdp-sesman.pam
    dest: /etc/pam.d/xrdp-sesman
    owner: root
    group: root
    mode: "0644"

# --- GNOME-on-Xorg session launcher (XRDP-04 render) — /etc/xrdp/startwm.sh ---
# So the RDP session renders a software-rendered GNOME-on-Xorg desktop (reuses the desktop role's
# GNOME), not a blank/Wayland screen. Mirrors dcv-gnome-session.sh.

- name: Install /etc/xrdp/startwm.sh (GNOME-on-Xorg software-render launcher)
  ansible.builtin.copy:
    src: startwm.sh
    dest: /etc/xrdp/startwm.sh
    owner: root
    group: root
    mode: "0755"

# --- TLS hardening (XRDP-03) — FIPS-safe cert + xrdp.ini security_layer=tls / crypt_level=high ---
# FIPS-safe: RSA-2048 is FIPS-acceptable; -sha256 forces a FIPS digest; a subjectAltName is
# required (a FIPS-strict TLS handshake rejects CN-only certs). creates: guards idempotency.
# Runtime TLS handshake correctness (incl. key perms the daemon can read) is proven by the
# Task 3 loopback +auth-only check — the right place per the DCV cert lesson.

- name: Generate FIPS-safe self-signed TLS cert for xrdp (XRDP-03)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -newkey rsa:2048 -sha256
      -keyout /etc/xrdp/key.pem
      -out /etc/xrdp/cert.pem
      -days 3650 -subj '/CN=devbox'
      -addext "subjectAltName=DNS:devbox"
  args:
    creates: /etc/xrdp/cert.pem

- name: Set xrdp TLS cert/key ownership + perms so the xrdp daemon can read the key (XRDP-03)
  # The xrdp daemon runs as the `xrdp` user (created by the SPAL xrdp RPM). root:xrdp 0640 lets
  # the daemon read the key while keeping it off world-read. Wrong perms -> xrdp cannot load the
  # cert and the TLS handshake fails.
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: xrdp
    mode: "0640"
  loop:
    - /etc/xrdp/cert.pem
    - /etc/xrdp/key.pem

- name: Harden /etc/xrdp/xrdp.ini — TLS security layer, high crypt, cert/key paths (XRDP-03)
  # Idempotent INI edit under [Globals]. security_layer=tls + crypt_level=high replace the weak
  # legacy `rdp` layer; the cert/key paths point at the FIPS-safe cert above. create:false fails
  # loudly if the SPAL xrdp RPM ever stops shipping /etc/xrdp/xrdp.ini (layout regression).
  community.general.ini_file:
    path: /etc/xrdp/xrdp.ini
    section: Globals
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: "0644"
    create: false
    # xrdp.ini convention is key=value (no spaces); the XRDP-03 bake assert also
    # substring-matches `security_layer=tls`/`crypt_level=high` without spaces, so
    # the module's default `key = value` (no_extra_spaces:false) must be disabled.
    no_extra_spaces: true
  loop:
    - { option: "security_layer", value: "tls" }
    - { option: "crypt_level", value: "high" }
    - { option: "certificate", value: "/etc/xrdp/cert.pem" }
    - { option: "key_file", value: "/etc/xrdp/key.pem" }

# --- Session backend (XRDP render) — force the Xorg (xorgxrdp) backend, drop Xvnc ---
# The SPAL xrdp.ini ships both an [Xorg] (xorgxrdp, code=20) and an [Xvnc] session section.
# We install xorgxrdp but NOT a Xvnc/tigervnc server, so any connection that lands on Xvnc
# dies. Pin the [Xorg] backend explicitly and remove [Xvnc] so RDP always uses Xorg.
- name: Pin the [Xorg] (xorgxrdp) session backend in xrdp.ini (XRDP render)
  community.general.ini_file:
    path: /etc/xrdp/xrdp.ini
    section: Xorg
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: "0644"
    create: false
    no_extra_spaces: true
  loop:
    - { option: "name", value: "Xorg" }
    - { option: "lib", value: "libxup.so" }
    - { option: "username", value: "ask" }
    - { option: "password", value: "ask" }
    # No `ip=` — the Xorg backend reaches sesman over a local socket keyed by the
    # display (port=-1 + code=20); `ip` is vestigial (only TCP backends like Xvnc used it).
    - { option: "port", value: "-1" }
    - { option: "code", value: "20" }

- name: Remove the [Xvnc] session backend from xrdp.ini (no Xvnc/tigervnc server installed)
  community.general.ini_file:
    path: /etc/xrdp/xrdp.ini
    section: Xvnc
    state: absent

# --- Service enable (XRDP-01) — enable both, no start needed at bake ---

- name: Enable xrdp + xrdp-sesman at boot (XRDP-01)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - xrdp
    - xrdp-sesman

# --- SELinux relabel (belt-and-braces) — done at bake while permissive (hardening flips it) ---
# SPAL RPMs land in distro paths (/usr/sbin, /usr/lib64) with sane default labels, so no custom
# fcontext is invented. failed_when:false tolerates any path absent on a given build.

- name: SELinux relabel xrdp install paths + config (XRDP-01)
  ansible.builtin.command:
    cmd: restorecon -RvF /etc/xrdp /usr/sbin/xrdp /usr/sbin/xrdp-sesman /usr/lib64/xorg/modules
  changed_when: false
  failed_when: false

# ── XRDP-04 STATIC bake asserts (mirror dcv-04, slimmer) ──
# Fail the bake LOUDLY if any xrdp/xorgxrdp artifact is missing, if xrdp.ini lost the TLS
# hardening (or gained the weak `security_layer=rdp`), if the PAM file does not delegate to
# password-auth, or if either service is not enabled. Runs LAST in the role, after every
# asserted artifact exists, and BEFORE hardening. This is the STATIC half — Task 3 is the
# runtime/adversarial half; together they close "bake green, service dead".
#
# NOTE: the /usr/sbin/xrdp{,-sesman} binaries and the xorgxrdp
# /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so module are the EPEL/SPAL RPM convention
# ([RESOLVE-AT-EXEC]). Confirm at first bake with `rpm -ql xrdp | grep sbin` and
# `rpm -ql xorgxrdp | grep xorg/modules`, and adjust the stats if the SPAL layout differs.

- name: Stat the xrdp daemon binary (XRDP-04)
  ansible.builtin.stat:
    path: /usr/sbin/xrdp
  register: xrdp_bake_xrdp

- name: Stat the xrdp-sesman binary (XRDP-04)
  ansible.builtin.stat:
    path: /usr/sbin/xrdp-sesman
  register: xrdp_bake_sesman

- name: Stat /etc/xrdp/xrdp.ini (XRDP-04)
  ansible.builtin.stat:
    path: /etc/xrdp/xrdp.ini
  register: xrdp_bake_ini

- name: Stat /etc/pam.d/xrdp-sesman (XRDP-04)
  ansible.builtin.stat:
    path: /etc/pam.d/xrdp-sesman
  register: xrdp_bake_pam

- name: Stat /etc/xrdp/startwm.sh (XRDP-04)
  ansible.builtin.stat:
    path: /etc/xrdp/startwm.sh
  register: xrdp_bake_startwm

- name: Stat the FIPS TLS cert /etc/xrdp/cert.pem (XRDP-03 / XRDP-04)
  ansible.builtin.stat:
    path: /etc/xrdp/cert.pem
  register: xrdp_bake_cert

- name: Stat the FIPS TLS key /etc/xrdp/key.pem (XRDP-03 / XRDP-04)
  ansible.builtin.stat:
    path: /etc/xrdp/key.pem
  register: xrdp_bake_key

- name: Stat the xorgxrdp driver module (XRDP-04)
  ansible.builtin.stat:
    path: /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so
  register: xrdp_bake_module

- name: Assert all xrdp artifacts (binaries, ini, pam, startwm, cert/key, module) exist (XRDP-04)
  ansible.builtin.assert:
    that:
      - xrdp_bake_xrdp.stat.exists
      - xrdp_bake_sesman.stat.exists
      - xrdp_bake_ini.stat.exists
      - xrdp_bake_pam.stat.exists
      - xrdp_bake_startwm.stat.exists
      - xrdp_bake_cert.stat.exists
      - xrdp_bake_key.stat.exists
      - xrdp_bake_module.stat.exists
    fail_msg: >-
      XRDP-04 bake assertion FAILED. One or more required xrdp artifacts are missing:
        /usr/sbin/xrdp exists: {{ xrdp_bake_xrdp.stat.exists | default(false) }}
        /usr/sbin/xrdp-sesman exists: {{ xrdp_bake_sesman.stat.exists | default(false) }}
        /etc/xrdp/xrdp.ini exists: {{ xrdp_bake_ini.stat.exists | default(false) }}
        /etc/pam.d/xrdp-sesman exists: {{ xrdp_bake_pam.stat.exists | default(false) }}
        /etc/xrdp/startwm.sh exists: {{ xrdp_bake_startwm.stat.exists | default(false) }}
        /etc/xrdp/cert.pem exists: {{ xrdp_bake_cert.stat.exists | default(false) }}
        /etc/xrdp/key.pem exists: {{ xrdp_bake_key.stat.exists | default(false) }}
        /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so exists: {{ xrdp_bake_module.stat.exists | default(false) }}
      If a /usr/sbin/xrdp* binary or the xrdpdev_drv.so module is missing, the SPAL install
      (xrdp / xorgxrdp) was skipped or failed, OR the SPAL RPM layout differs from the
      [RESOLVE-AT-EXEC] paths — confirm with `rpm -ql xrdp | grep sbin` and
      `rpm -ql xorgxrdp | grep xorg/modules` and adjust the stats. If a config / cert / PAM /
      startwm file is missing, the corresponding task above did not run — xrdp cannot start a
      working authenticated GNOME session.
    quiet: false

- name: Assert /etc/xrdp/startwm.sh is owner-executable (XRDP-04)
  ansible.builtin.assert:
    that:
      - xrdp_bake_startwm.stat.mode is match("07[0-9][0-9]")
    fail_msg: >-
      XRDP-04 bake assertion FAILED. /etc/xrdp/startwm.sh is present but NOT owner-executable
      (mode {{ xrdp_bake_startwm.stat.mode | default('?') }}, want 07xx). xrdp-sesman exec()s
      this script to launch the GNOME-on-Xorg desktop; a non-executable launcher yields a blank
      session. The install task must set mode 0755.
    quiet: false

- name: Slurp /etc/pam.d/xrdp-sesman for the password-auth assertion (XRDP-02)
  ansible.builtin.slurp:
    src: /etc/pam.d/xrdp-sesman
  register: xrdp_bake_pam_content

- name: Assert /etc/pam.d/xrdp-sesman delegates to password-auth (XRDP-02)
  ansible.builtin.assert:
    that:
      - "'password-auth' in (xrdp_bake_pam_content.content | b64decode)"
    fail_msg: >-
      XRDP-02 bake assertion FAILED. /etc/pam.d/xrdp-sesman does NOT include password-auth, so
      ec2-user cannot authenticate with the existing desktop password and RDP logins inherit
      neither the CIS faillock nor pwquality stack. Re-check the copy of files/xrdp-sesman.pam.
    quiet: false

- name: Slurp /etc/xrdp/xrdp.ini for the TLS-hardening assertion (XRDP-03)
  ansible.builtin.slurp:
    src: /etc/xrdp/xrdp.ini
  register: xrdp_bake_ini_content

- name: Assert xrdp.ini has security_layer=tls + crypt_level=high and NOT the weak rdp layer (XRDP-03)
  ansible.builtin.assert:
    that:
      - "'security_layer=tls' in (xrdp_bake_ini_content.content | b64decode)"
      - "'crypt_level=high' in (xrdp_bake_ini_content.content | b64decode)"
      - "'security_layer=rdp' not in (xrdp_bake_ini_content.content | b64decode)"
    fail_msg: >-
      XRDP-03 bake assertion FAILED. /etc/xrdp/xrdp.ini is missing the TLS hardening or still
      carries the weak legacy `security_layer=rdp` (Information Disclosure — unencrypted RDP
      wire traffic). It MUST contain security_layer=tls and crypt_level=high and MUST NOT
      contain security_layer=rdp. Re-check the ini_file hardening task.
    quiet: false

- name: Check xrdp + xrdp-sesman service enablement (XRDP-04)
  ansible.builtin.command:
    cmd: systemctl is-enabled xrdp xrdp-sesman
  register: xrdp_bake_enabled
  changed_when: false
  failed_when: false

- name: Assert xrdp + xrdp-sesman are enabled at boot (XRDP-04)
  ansible.builtin.assert:
    that:
      - xrdp_bake_enabled.rc == 0
    fail_msg: >-
      XRDP-04 bake assertion FAILED. xrdp or xrdp-sesman is not enabled at boot — RDP will not
      start after the instance launches.
      Output: {{ xrdp_bake_enabled.stdout | default('') }}
      Run: systemctl is-enabled xrdp xrdp-sesman
    quiet: false
