---
# xrdp role — build xrdp + xorgxrdp from sha256-pinned source tarballs
# Phase 10: BUILD + INSTALL only. No systemd enable, no ini templates,
# no PAM file content, no playbook.yml wiring — those are Phase 11/12.

# ── Step 1: Install build toolchain + Xorg SDK from AL2023 core repo ─────────
# All packages are from the AL2023 core mirror only; no third-party repo.
# xorg-x11-server-devel: RDP-03 hard-gate dep (Xorg SDK headers for xorgxrdp build)
# mesa-libGL-devel: satisfies the 'dri' pkg-config dep pulled in by xorg-server.pc (RESEARCH Pitfall 2)
- name: Install xrdp build dependencies from AL2023 core repo (RDP-02 + RDP-03)
  ansible.builtin.dnf:
    name:
      - gcc
      - make
      - autoconf
      - automake
      - libtool
      - pkgconfig
      - openssl-devel
      - pam-devel
      - libX11-devel
      - libXfixes-devel
      - libXrandr-devel
      - libjpeg-turbo-devel
      - nasm
      - pixman-devel
      - xorg-x11-server-devel  # RDP-03 hard-gate dep: Xorg SDK headers required by xorgxrdp build
      - mesa-libGL-devel        # satisfies 'dri' pkg-config dep pulled in by xorg-server.pc (Pitfall 2)
    state: present
  register: xrdp_build_deps_install

# ── Step 2: RDP-03 hard gate — abort bake loudly if any dep failed ────────────
- name: Assert xrdp build dependencies installed successfully (RDP-03)
  ansible.builtin.assert:
    that:
      - xrdp_build_deps_install is success
    fail_msg: >-
      One or more xrdp build dependencies failed to install.
      The most likely culprit is xorg-x11-server-devel, which is required by
      the xorgxrdp Xorg driver build. Verify that xorg-x11-server-devel is
      available in the AL2023 core repository on the bake instance:
        dnf info xorg-x11-server-devel
      All build deps must come from the AL2023 core mirror only (no external repos).
      If the repo is unreachable, check network connectivity from the bake VM.
    quiet: false

# ── Step 3: Fetch xrdp source tarball (sha256-pinned, RDP-01) ────────────────
- name: Download xrdp {{ xrdp_version }} source tarball (sha256-verified)
  ansible.builtin.get_url:
    url: "{{ xrdp_source_base_url }}/xrdp/releases/download/v{{ xrdp_version }}/xrdp-{{ xrdp_version }}.tar.gz"
    dest: "/tmp/xrdp-{{ xrdp_version }}.tar.gz"
    mode: "0644"
    checksum: "sha256:{{ xrdp_checksum_sha256 }}"

# ── Step 4: Extract xrdp source (Thrift/devtools pattern: chdir into versioned dir) ──
- name: Extract xrdp {{ xrdp_version }} source archive
  ansible.builtin.unarchive:
    src: "/tmp/xrdp-{{ xrdp_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/xrdp-{{ xrdp_version }}/configure"

# ── Step 5: Configure xrdp ───────────────────────────────────────────────────
# Release tarballs ship a generated configure script; no build-system regeneration needed.
# --with-pam-rules=redhat: mandatory — installs the redhat PAM rules at make install
# time; cannot be added retroactively (RESEARCH Pitfall 4). Phase 11 overrides content.
- name: Configure xrdp {{ xrdp_version }}
  ansible.builtin.command:
    cmd: >
      ./configure
      --prefix=/usr/local
      --sysconfdir=/etc
      --enable-pam
      --with-pam-rules=redhat
      --enable-jpeg
      --enable-tjpeg
      --enable-pixman
      --disable-tests
    chdir: "/tmp/xrdp-{{ xrdp_version }}"
    creates: "/tmp/xrdp-{{ xrdp_version }}/Makefile"

# ── Step 6: Build xrdp ───────────────────────────────────────────────────────
- name: Build xrdp {{ xrdp_version }}
  ansible.builtin.command:
    cmd: "make -j{{ ansible_processor_vcpus | default(2) }}"
    chdir: "/tmp/xrdp-{{ xrdp_version }}"
    creates: "/tmp/xrdp-{{ xrdp_version }}/xrdp/xrdp"

# ── Step 7: Install xrdp ─────────────────────────────────────────────────────
# Creates /usr/local/sbin/xrdp and /usr/local/lib/pkgconfig/xrdp.pc
# The xrdp.pc file is consumed by xorgxrdp configure in Step 11 (via PKG_CONFIG_PATH).
- name: Install xrdp {{ xrdp_version }}
  ansible.builtin.command:
    cmd: make install
    chdir: "/tmp/xrdp-{{ xrdp_version }}"
    creates: /usr/local/sbin/xrdp

# ── Step 8: Fetch xorgxrdp source tarball (sha256-pinned, RDP-01) ────────────
# ORDERING NOTE: xorgxrdp MUST be built AFTER xrdp is installed (Step 7 above).
# xorgxrdp configure requires /usr/local/lib/pkgconfig/xrdp.pc (installed by xrdp
# make install). Building before install causes: "Package 'xrdp' not found" (Pitfall 1).
- name: Download xorgxrdp {{ xorgxrdp_version }} source tarball (sha256-verified)
  ansible.builtin.get_url:
    url: "{{ xrdp_source_base_url }}/xorgxrdp/releases/download/v{{ xorgxrdp_version }}/xorgxrdp-{{ xorgxrdp_version }}.tar.gz"
    dest: "/tmp/xorgxrdp-{{ xorgxrdp_version }}.tar.gz"
    mode: "0644"
    checksum: "sha256:{{ xorgxrdp_checksum_sha256 }}"

# ── Step 9: Extract xorgxrdp source ──────────────────────────────────────────
- name: Extract xorgxrdp {{ xorgxrdp_version }} source archive
  ansible.builtin.unarchive:
    src: "/tmp/xorgxrdp-{{ xorgxrdp_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/xorgxrdp-{{ xorgxrdp_version }}/configure"

# ── Step 10: Configure xorgxrdp ──────────────────────────────────────────────
# PKG_CONFIG_PATH is MANDATORY: xrdp make install puts xrdp.pc in /usr/local/lib/pkgconfig,
# which is not in the default pkg-config search path on AL2023 (RESEARCH Pitfall 1).
# mesa-libGL-devel (installed in Step 1) satisfies the 'dri' dep from xorg-server.pc (Pitfall 2).
# Release tarball ships configure; no build-system regeneration step needed.
- name: Configure xorgxrdp {{ xorgxrdp_version }} against installed xrdp pkg-config (RDP-02)
  ansible.builtin.command:
    cmd: ./configure
    chdir: "/tmp/xorgxrdp-{{ xorgxrdp_version }}"
    creates: "/tmp/xorgxrdp-{{ xorgxrdp_version }}/Makefile"
  environment:
    PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

# ── Step 11: Build xorgxrdp ──────────────────────────────────────────────────
- name: Build xorgxrdp {{ xorgxrdp_version }}
  ansible.builtin.command:
    cmd: "make -j{{ ansible_processor_vcpus | default(2) }}"
    chdir: "/tmp/xorgxrdp-{{ xorgxrdp_version }}"
    creates: "/tmp/xorgxrdp-{{ xorgxrdp_version }}/module/libxorgxrdp.la"

# ── Step 12: Install xorgxrdp ────────────────────────────────────────────────
# Expected module path on AL2023 x86_64: /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so
# BAKE-TIME VERIFICATION ITEM (RESEARCH Pitfall 3 / Open Question 2):
# If AL2023's xorg-server.pc moduledir resolves to /usr/local/lib/xorg/... instead of
# /usr/lib64/xorg/..., the creates: guard and Phase 11 Xorg config must use the actual
# path. Verify post-install: ls /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so
- name: Install xorgxrdp {{ xorgxrdp_version }} Xorg driver modules
  ansible.builtin.command:
    cmd: make install
    chdir: "/tmp/xorgxrdp-{{ xorgxrdp_version }}"
    creates: /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so

# ── Step 13: SELinux relabel (Pitfall 6 future-proofing) ─────────────────────
# AL2023 defaults to SELinux permissive, but relabelling xorgxrdp modules now avoids
# audit denials if the operator later switches to enforcing mode. Cheap + forward-safe.
- name: SELinux relabel xorgxrdp module directory (Pitfall 6 future-proofing)
  ansible.builtin.command:
    cmd: restorecon -Rv /usr/lib64/xorg/modules/
  changed_when: false

# ── Step 14: Cleanup /tmp source trees and tarballs ──────────────────────────
# Belt-and-suspenders: playbook post_tasks also globs /tmp/*.tar.gz; this removes
# the extracted source directories which the global glob does not cover.
- name: Clean up xrdp + xorgxrdp source trees and tarballs from /tmp
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/xrdp-{{ xrdp_version }}"
    - "/tmp/xorgxrdp-{{ xorgxrdp_version }}"
    - "/tmp/xrdp-{{ xrdp_version }}.tar.gz"
    - "/tmp/xorgxrdp-{{ xorgxrdp_version }}.tar.gz"

# ── Phase 11: config + cert + service (RDP-04/05/06/07/08/13) ──
# Phase 10 (above) built + installed xrdp/xorgxrdp. The block below configures the
# service, generates the TLS cert, wires PAM/session, enables the systemd units,
# and asserts the bake. /etc/xrdp already exists from the Phase 10 make install.

# --- Runtime deps (RDP-05/07) — install the X server + dbus-x11 from AL2023 core ---
# xorg-x11-server-Xorg provides /usr/libexec/Xorg (sesman.ini [Xorg] param); dbus-x11
# provides dbus-launch (startwm.sh). Airgap policy: dnf from AL2023 core only — mirrors
# the Step-1 dnf pattern above. CIS rule 2.2.1 (which removes xorg-x11-server-common,
# a dep of -Xorg) is disabled in hardening/defaults so this survives the hardening role.
- name: Install xrdp runtime dependencies from AL2023 core repo (RDP-05/07)
  ansible.builtin.dnf:
    name: "{{ xrdp_runtime_deps }}"
    state: present
  register: xrdp_runtime_deps_install

- name: Assert xrdp runtime dependencies installed successfully (RDP-05/07)
  ansible.builtin.assert:
    that:
      - xrdp_runtime_deps_install is success
    fail_msg: >-
      One or more xrdp runtime dependencies failed to install:
      xorg-x11-server-Xorg (provides /usr/libexec/Xorg, the X server the xorgxrdp
      sesman.ini [Xorg] backend exec's) and dbus-x11 (provides dbus-launch, called by
      startwm.sh). Both MUST come from the AL2023 core repo (airgap policy: no external
      repo, no S3, no private mirror). Verify availability on the bake instance:
        dnf info xorg-x11-server-Xorg dbus-x11
    quiet: false

# --- TLS cert (RDP-04) — mirrors the desktop role noVNC openssl pattern ---
# FIPS-safe: RSA-2048 is FIPS-acceptable; -sha256 forces a FIPS-approved digest; a
# subjectAltName is required for a modern/FIPS-strict TLS handshake (CN-only certs are
# rejected). creates: guards idempotency — fresh bakes have no prior cert (bake-time, not
# a live rotation). RDP-13 asserts the SAN is present so the RDP TLS cert survives FIPS mode.
- name: Generate self-signed TLS cert for xrdp (RDP-04)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -newkey rsa:2048 -sha256
      -keyout /etc/xrdp/key.pem
      -out /etc/xrdp/cert.pem
      -days 3650 -subj '/CN=devbox'
      -addext "subjectAltName=DNS:devbox"
  args:
    creates: /etc/xrdp/cert.pem

- name: Set xrdp TLS cert/key permissions (RDP-04)
  # key.pem is 0600 root-only: xrdp runs as root in this config (no runtime_user split).
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/xrdp/cert.pem, mode: "0644" }
    - { path: /etc/xrdp/key.pem, mode: "0600" }

# --- Config files (RDP-04 / RDP-05) — overwrite the make-installed defaults ---
- name: Template TLS-enabled xrdp.ini (RDP-04)
  ansible.builtin.template:
    src: xrdp.ini.j2
    dest: /etc/xrdp/xrdp.ini
    owner: root
    group: root
    mode: "0644"

- name: Template sesman.ini with Xorg backend (RDP-05)
  ansible.builtin.template:
    src: sesman.ini.j2
    dest: /etc/xrdp/sesman.ini
    owner: root
    group: root
    mode: "0644"

# --- ld.so wiring (RESEARCH Pitfall 5) — make /usr/local/lib loadable ---
# Phase 10 installed libxup.so under /usr/local/lib/xrdp; /usr/local/lib is not in
# the default ld.so search path on AL2023. Add it so the Xorg session can load it.
- name: Add /usr/local/lib to the dynamic linker search path for xrdp (Pitfall 5)
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/xrdp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      /usr/local/lib

- name: Refresh the dynamic linker cache (Pitfall 5)
  ansible.builtin.command:
    cmd: ldconfig
  changed_when: false

# --- PAM delegation (RDP-06) — overwrite the make-installed file for exact content ---
# Delegates to password-auth so RDP logins inherit the CIS faillock + pwquality stack.
# pam_loginuid evaluation (RISK/W3): the file pins `session required pam_loginuid.so` — the
# upstream redhat-standard handling for xrdp-sesman (it is `required` in sshd's stack too).
# Setting the audit loginuid does NOT block a PAM-authenticated RDP session under systemd, so
# it is intentionally retained as `required`. Its live-session effect is a runtime property
# not fully provable at bake — covered by the RDP-14 human UAT gate.
- name: Install xrdp-sesman PAM file delegating to password-auth (RDP-06)
  ansible.builtin.copy:
    src: xrdp-sesman.pam
    dest: /etc/pam.d/xrdp-sesman
    owner: root
    group: root
    mode: "0644"

# --- GNOME Xorg session launcher (RDP-07) — overwrite make-installed default ---
- name: Template startwm.sh GNOME Xorg session launcher (RDP-07)
  ansible.builtin.template:
    src: startwm.sh.j2
    dest: /etc/xrdp/startwm.sh
    owner: root
    group: root
    mode: "0755"

# --- colord polkit rule (RESEARCH Pitfall 6) — avoid the color-manager auth hang ---
# AL2023 ships polkit 121+, which IGNORES /etc/polkit-1/localauthority .pkla files. The
# allow-rule MUST be a JavaScript .rules file under /etc/polkit-1/rules.d/ (the dead .pkla
# at files/45-allow-colord.pkla is no longer installed).
- name: Ensure polkit rules.d directory exists (Pitfall 6)
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow colord without an auth prompt for GNOME-over-xrdp sessions (Pitfall 6)
  ansible.builtin.copy:
    src: 45-allow-colord.rules
    dest: /etc/polkit-1/rules.d/45-allow-colord.rules
    owner: root
    group: root
    mode: "0644"

# --- systemd units + enable (RDP-08) — place units explicitly (Pitfall 1) ---
# make install may install init.d fallback instead of systemd units when
# pkg-config systemd is absent; copy the corrected /usr/local/sbin units regardless.
- name: Install xrdp systemd unit (RDP-08)
  ansible.builtin.copy:
    src: xrdp.service
    dest: /usr/lib/systemd/system/xrdp.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Install xrdp-sesman systemd unit (RDP-08)
  ansible.builtin.copy:
    src: xrdp-sesman.service
    dest: /usr/lib/systemd/system/xrdp-sesman.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

# daemon_reload here guarantees the just-placed units are loaded before enable (Pitfall 8).
- name: Enable xrdp service at boot (RDP-08)
  ansible.builtin.systemd:
    name: xrdp
    enabled: true
    daemon_reload: true

- name: Enable xrdp-sesman service at boot (RDP-08)
  ansible.builtin.systemd:
    name: xrdp-sesman
    enabled: true
    daemon_reload: true

# --- Full SELinux relabel (HIGH) — done at bake, BEFORE hardening flips SELinux to enforcing ---
# The Phase-10 restorecon only covered the xorg module dir. Relabel the newly-installed X
# server, the /usr/local xrdp binaries + libs, and /etc/xrdp (cert.pem/key.pem included) so an
# enforcing-mode boot raises no AVC denials that would silently break the RDP session. Placed
# AFTER cert + config + unit + polkit tasks so every relabelled file already exists.
- name: SELinux relabel the X server, /usr/local xrdp binaries, and /etc/xrdp (HIGH)
  ansible.builtin.command:
    cmd: restorecon -RvF /usr/libexec/Xorg /usr/local/sbin /usr/local/bin /usr/local/lib /etc/xrdp
  changed_when: false

# ── RDP-13 bake assertion ──
# Fail the bake loudly if the binary, the xorgxrdp module, either ini file, or
# either enabled service is absent. Does NOT attempt a live RDP login (Phase-12 UAT).
- name: Stat xrdp binary (RDP-13)
  ansible.builtin.stat:
    path: /usr/local/sbin/xrdp
  register: xrdp_rdp13_binary

- name: Stat xrdpdev Xorg driver module (RDP-13)
  ansible.builtin.stat:
    path: /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so
  register: xrdp_rdp13_module

- name: Stat xrdp.ini config file (RDP-13)
  ansible.builtin.stat:
    path: /etc/xrdp/xrdp.ini
  register: xrdp_rdp13_ini

- name: Stat sesman.ini config file (RDP-13)
  ansible.builtin.stat:
    path: /etc/xrdp/sesman.ini
  register: xrdp_rdp13_sesman

# --- Extended RDP-13 stats (CRITICAL #4) — the runtime the original assert was blind to ---
# /usr/libexec/Xorg (the X server CRITICAL #1 installs), the TLS cert + key, the GNOME session
# launcher, and the PAM file. The bake MUST fail if ANY is absent — without them no RDP session
# can start even though the role's own binary/module/inis are present.
- name: Stat the X server /usr/libexec/Xorg (RDP-13)
  ansible.builtin.stat:
    path: /usr/libexec/Xorg
  register: xrdp_rdp13_xserver

- name: Stat the TLS cert /etc/xrdp/cert.pem (RDP-13)
  ansible.builtin.stat:
    path: /etc/xrdp/cert.pem
  register: xrdp_rdp13_cert

- name: Stat the TLS key /etc/xrdp/key.pem (RDP-13)
  ansible.builtin.stat:
    path: /etc/xrdp/key.pem
  register: xrdp_rdp13_key

- name: Stat the GNOME session launcher /etc/xrdp/startwm.sh (RDP-13)
  ansible.builtin.stat:
    path: /etc/xrdp/startwm.sh
  register: xrdp_rdp13_startwm

- name: Stat the PAM file /etc/pam.d/xrdp-sesman (RDP-13)
  ansible.builtin.stat:
    path: /etc/pam.d/xrdp-sesman
  register: xrdp_rdp13_pam

- name: Assert xrdp binary, xorgxrdp module, config files, X server, cert/key, startwm + PAM are present (RDP-13)
  ansible.builtin.assert:
    that:
      - xrdp_rdp13_binary.stat.exists
      - xrdp_rdp13_module.stat.exists
      - xrdp_rdp13_ini.stat.exists
      - xrdp_rdp13_sesman.stat.exists
      - xrdp_rdp13_xserver.stat.exists
      - xrdp_rdp13_cert.stat.exists
      - xrdp_rdp13_key.stat.exists
      - xrdp_rdp13_startwm.stat.exists
      - xrdp_rdp13_pam.stat.exists
    fail_msg: >-
      RDP-13 bake assertion FAILED. One or more required files are missing:
        /usr/local/sbin/xrdp exists: {{ xrdp_rdp13_binary.stat.exists | default(false) }}
        /usr/lib64/xorg/modules/drivers/xrdpdev_drv.so exists: {{ xrdp_rdp13_module.stat.exists | default(false) }}
        /etc/xrdp/xrdp.ini exists: {{ xrdp_rdp13_ini.stat.exists | default(false) }}
        /etc/xrdp/sesman.ini exists: {{ xrdp_rdp13_sesman.stat.exists | default(false) }}
        /usr/libexec/Xorg exists: {{ xrdp_rdp13_xserver.stat.exists | default(false) }}
        /etc/xrdp/cert.pem exists: {{ xrdp_rdp13_cert.stat.exists | default(false) }}
        /etc/xrdp/key.pem exists: {{ xrdp_rdp13_key.stat.exists | default(false) }}
        /etc/xrdp/startwm.sh exists: {{ xrdp_rdp13_startwm.stat.exists | default(false) }}
        /etc/pam.d/xrdp-sesman exists: {{ xrdp_rdp13_pam.stat.exists | default(false) }}
      If /usr/libexec/Xorg is missing here, the runtime-dep install (xorg-x11-server-Xorg,
      CRITICAL #1) was skipped or failed — this assert runs INSIDE the xrdp role, BEFORE the
      hardening role, so CIS rule 2.2.1 has not run yet and is NOT the cause at this point.
      (A post-hardening assert in playbook.yml catches a CIS-2.2.1 deletion.) Otherwise the
      Phase 10 build may not have run, or make install / a config task failed silently.
    quiet: false

- name: Check xrdp + xrdp-sesman service enablement (RDP-13)
  ansible.builtin.command:
    cmd: systemctl is-enabled xrdp xrdp-sesman
  register: xrdp_rdp13_enabled
  changed_when: false
  failed_when: false

- name: Assert xrdp and xrdp-sesman are enabled (RDP-13)
  ansible.builtin.assert:
    that:
      - xrdp_rdp13_enabled.rc == 0
    fail_msg: >-
      RDP-13 bake assertion FAILED. xrdp or xrdp-sesman is not enabled.
      Output: {{ xrdp_rdp13_enabled.stdout | default('') }}
      Run: systemctl is-enabled xrdp xrdp-sesman
    quiet: false

# --- RDP-13 cert-SAN proof (Task 2 FIPS requirement) — the cert the TLS handshake presents ---
# A FIPS-strict TLS handshake rejects CN-only certs; prove the self-signed cert carries the
# subjectAltName Task 2's cert-gen added, not just that cert.pem exists.
- name: Read the xrdp TLS cert text for the SAN check (RDP-13)
  ansible.builtin.command:
    cmd: openssl x509 -in /etc/xrdp/cert.pem -noout -text
  register: xrdp_rdp13_certtext
  changed_when: false
  failed_when: false

- name: Assert the xrdp TLS cert carries a subjectAltName (RDP-13)
  ansible.builtin.assert:
    that:
      - "'Subject Alternative Name' in xrdp_rdp13_certtext.stdout"
      - "'DNS:devbox' in xrdp_rdp13_certtext.stdout"
    fail_msg: >-
      RDP-13 bake assertion FAILED. The xrdp TLS cert /etc/xrdp/cert.pem has no
      subjectAltName — a FIPS-strict RDP TLS handshake will reject it. The cert-gen task
      (RDP-04) must pass -addext "subjectAltName=DNS:devbox" (Task 2). If the cert predates
      that change, remove /etc/xrdp/cert.pem and re-run the bake to regenerate it.
    quiet: false
