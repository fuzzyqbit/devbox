---
# --- kubectl ---
- name: Download kubectl {{ kubectl_version }}
  get_url:
    url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Enable kubectl tab completion
  lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'source <(kubectl completion bash)'
    regexp: 'kubectl completion'
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"

# --- helm ---
- name: Download helm {{ helm_version }}
  get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp/helm.tar.gz
    mode: "0644"

- name: Install helm binary
  unarchive:
    src: /tmp/helm.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
      - linux-amd64/helm
    mode: "0755"

- name: Clean up helm archive
  file:
    path: /tmp/helm.tar.gz
    state: absent

- name: Enable helm tab completion
  lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'source <(helm completion bash)'
    regexp: 'helm completion'
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"

