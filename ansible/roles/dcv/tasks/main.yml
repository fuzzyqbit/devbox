---
# Amazon DCV role — install (airgap) + dcv.conf + FIPS cert + oneshot virtual session +
# colord/PAM + SELinux relabel. Ported from git 51c5f1f with v4.0 hardening deltas.
# Wires before `hardening` (Phase 14); the bake assert is plan 13-02.

- name: Assert the dev_user PAM password was set by the secrets role
  ansible.builtin.assert:
    that:
      - desktop_vnc_password is defined
      - desktop_vnc_password | length > 0
    fail_msg: >-
      desktop_vnc_password is not set. Did the `secrets` role run before `dcv`?
      The dcv role uses authentication=system, which relies on the dev_user PAM
      password the secrets pipeline generates/publishes/applies. Check
      ansible/playbook.yml role ordering and the layers.desktop / layers.dcv flags.
    quiet: true
  no_log: true

# --- NICE GPG key — import BEFORE any RPM install (airgap integrity gate, DCV-01) ---

- name: Import NICE GPG key
  ansible.builtin.rpm_key:
    key: https://d1uj6qtbmh3dt5.cloudfront.net/NICE-GPG-KEY
    state: present

# --- Download + extract the pinned DCV tarball (CloudFront, DCV-01) ---

- name: Download Amazon DCV tarball
  # Dual-task pattern: this checksum-gated task runs only once dcv_tarball_sha256 is filled
  # (deferred-pin posture, CLAUDE.md §9). Until then the GPG signature is the integrity gate.
  ansible.builtin.get_url:
    url: "https://d1uj6qtbmh3dt5.cloudfront.net/{{ dcv_version }}/Servers/nice-dcv-{{ dcv_version }}-{{ dcv_build_server }}-amzn2023-x86_64.tgz"
    dest: /tmp/nice-dcv.tgz
    mode: "0644"
    checksum: "{% if dcv_tarball_sha256 | length > 0 %}sha256:{{ dcv_tarball_sha256 }}{% else %}{% endif %}"
  when: dcv_tarball_sha256 | length > 0

- name: Download Amazon DCV tarball (no checksum — deferred-pin)
  ansible.builtin.get_url:
    url: "https://d1uj6qtbmh3dt5.cloudfront.net/{{ dcv_version }}/Servers/nice-dcv-{{ dcv_version }}-{{ dcv_build_server }}-amzn2023-x86_64.tgz"
    dest: /tmp/nice-dcv.tgz
    mode: "0644"
  when: not (dcv_tarball_sha256 | length > 0)

- name: Create DCV extract directory
  ansible.builtin.file:
    path: /tmp/dcv-extract
    state: directory
    mode: "0755"

- name: Extract DCV tarball
  ansible.builtin.unarchive:
    src: /tmp/nice-dcv.tgz
    dest: /tmp/dcv-extract
    remote_src: true
    extra_opts:
      - "--strip-components=1"

# --- Install the three non-GPU DCV RPMs from the extracted tarball (DCV-01) ---
# Glob by name (not hardcoded build) so the xdcv build skew (688 != 20103) is handled.

- name: Find nice-dcv-server RPM
  ansible.builtin.find:
    paths: /tmp/dcv-extract
    patterns: "nice-dcv-server-*.rpm"
    file_type: file
  register: dcv_server_rpm

- name: Find nice-xdcv RPM
  ansible.builtin.find:
    paths: /tmp/dcv-extract
    patterns: "nice-xdcv-*.rpm"
    file_type: file
  register: dcv_xdcv_rpm

- name: Find nice-dcv-web-viewer RPM
  ansible.builtin.find:
    paths: /tmp/dcv-extract
    patterns: "nice-dcv-web-viewer-*.rpm"
    file_type: file
  register: dcv_webviewer_rpm

- name: Install DCV RPMs (nice-dcv-server, nice-xdcv, nice-dcv-web-viewer)
  # disable_gpg_check stays false — the NICE GPG key imported above verifies the signature.
  # NEVER add --nogpgcheck (CLAUDE.md §8 / airgap §2).
  ansible.builtin.dnf:
    name:
      - "{{ dcv_server_rpm.files[0].path }}"
      - "{{ dcv_xdcv_rpm.files[0].path }}"
      - "{{ dcv_webviewer_rpm.files[0].path }}"
    state: present
    disable_gpg_check: false

- name: Install DCV runtime dependencies from the AL2023 core repo (DCV-05)
  # policycoreutils-python-utils provides `semanage`; it is NOT a DCV dep, so add it
  # explicitly. AL2023 core repo (distro GPG), airgap-safe — no get_url.
  ansible.builtin.dnf:
    name: "{{ dcv_runtime_deps }}"
    state: present

# --- Configure DCV (DCV-02) ---

- name: Install DCV configuration file
  ansible.builtin.template:
    src: dcv.conf.j2
    dest: /etc/dcv/dcv.conf
    mode: "0644"
  notify: reload systemd

# --- DCV virtual session systemd unit (DCV-03) — the ONLY auto-virtual mechanism ---

- name: Install DCV virtual session systemd service
  ansible.builtin.template:
    src: dcv-virtual-session.service.j2
    dest: /etc/systemd/system/dcv-virtual-session.service
    mode: "0644"
  notify: reload systemd

- name: Enable dcvserver service
  ansible.builtin.systemd:
    name: dcvserver
    enabled: true
    daemon_reload: true

- name: Enable DCV virtual session service
  ansible.builtin.systemd:
    name: dcv-virtual-session
    enabled: true
    daemon_reload: true

# --- FIPS-safe TLS cert (DCV-05) — ported from the xrdp cert recipe, retargeted paths ---
# DCV reads the cert from the HARDCODED names /etc/dcv/dcv.pem + /etc/dcv/dcv.key (there is
# no dcv.conf cert key). FIPS-safe: RSA-2048 is FIPS-acceptable; -sha256 forces a FIPS digest;
# a subjectAltName is required (a FIPS-strict TLS handshake rejects CN-only certs). creates:
# guards idempotency. Runs AFTER the RPM install so the `dcv` user + /etc/dcv exist.
- name: Generate FIPS-safe self-signed TLS cert for DCV (DCV-05)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -newkey rsa:2048 -sha256
      -keyout /etc/dcv/dcv.key
      -out /etc/dcv/dcv.pem
      -days 3650 -subj '/CN=devbox'
      -addext "subjectAltName=DNS:devbox"
  args:
    creates: /etc/dcv/dcv.pem

- name: Set DCV TLS cert/key ownership + perms (DCV-05) — dcv:dcv 0600 (AWS-mandated)
  # AWS requires the cert + key be owned by the `dcv` user (auto-created by nice-dcv-server)
  # and mode 0600 (NOT 0644). Wrong perms/owner → DCV ignores the cert and may fall back to a
  # non-FIPS auto-cert that the FIPS handshake rejects.
  ansible.builtin.file:
    path: "{{ item }}"
    owner: dcv
    group: dcv
    mode: "0600"
  loop:
    - /etc/dcv/dcv.pem
    - /etc/dcv/dcv.key

# --- colord polkit rule (DCV-03 / Pitfall) — avoid the color-manager auth hang ---
# AL2023 ships polkit 121+, which IGNORES /etc/polkit-1/localauthority .pkla files. The
# allow-rule MUST be a JavaScript .rules file under /etc/polkit-1/rules.d/.
- name: Ensure polkit rules.d directory exists
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow colord without an auth prompt for GNOME-over-DCV sessions
  ansible.builtin.copy:
    src: 45-allow-colord.rules
    dest: /etc/polkit-1/rules.d/45-allow-colord.rules
    owner: root
    group: root
    mode: "0644"

# --- PAM delegation (DCV-02) — /etc/pam.d/dcv (default pam-service-name) ---
# Delegates to password-auth so DCV logins inherit the CIS faillock + pwquality stack.
- name: Install /etc/pam.d/dcv delegating to password-auth (DCV-02)
  ansible.builtin.copy:
    src: dcv.pam
    dest: /etc/pam.d/dcv
    owner: root
    group: root
    mode: "0644"

# --- SELinux relabel (DCV-05) — restorecon over DCV install paths, BEFORE hardening ---
# Done at bake while SELinux is still permissive (hardening, the last role, flips enforcing
# and reboots). DCV is a vendor RPM landing in distro paths (/usr/bin, /usr/lib64) with sane
# default labels, so no custom fcontext type is invented (unlike xrdp's /usr/local/sbin).
# changed_when:false + failed_when:false tolerate paths absent on a given build (e.g.
# /var/run/dcv pre-first-start). AVC-clean under enforcing is proven only at the Phase-15 live
# UAT; a scoped audit2allow module is the escalation if denials appear. Never `setenforce 0`.
# NOTE: DCV binary paths (/usr/bin/dcvserver, /usr/bin/Xdcv) are confirmed-at-bake — confirm
# with `rpm -ql nice-dcv-server nice-xdcv | grep /bin/` if they ever change.
- name: SELinux relabel DCV install paths + config (DCV-05)
  ansible.builtin.command:
    cmd: restorecon -RvF /usr/bin/dcv* /usr/lib64/dcv* /etc/dcv /var/lib/dcv /var/run/dcv
  changed_when: false
  failed_when: false

# --- Cleanup ---

- name: Clean up DCV temporary files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/nice-dcv.tgz
    - /tmp/dcv-extract
