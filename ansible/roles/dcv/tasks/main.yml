---
- name: Assert VNC password was set by the secrets role
  ansible.builtin.assert:
    that:
      - desktop_vnc_password is defined
      - desktop_vnc_password | length > 0
      - desktop_vnc_password != "changeme"
    fail_msg: >-
      desktop_vnc_password is not set. Did the `secrets` role run before `desktop`?
      The dcv role depends on the desktop role having already set the dev_user PAM
      password. Check ansible/playbook.yml role ordering and layers.desktop flag.
    quiet: true
  no_log: true

# --- NICE GPG key — import BEFORE any RPM install ---

- name: Import NICE GPG key
  ansible.builtin.rpm_key:
    key: https://d1uj6qtbmh3dt5.cloudfront.net/NICE-GPG-KEY
    state: present

# --- Download and extract DCV tarball ---

- name: Download Amazon DCV tarball
  # SHA-256 checksum omitted until pinned (deferred-pin posture matching CLAUDE.md §9).
  # To pin: run `sha256sum nice-dcv-<version>-<build>-amzn2023-x86_64.tgz` after first bake
  # and set dcv_tarball_sha256 in defaults/main.yml.
  get_url:
    url: "https://d1uj6qtbmh3dt5.cloudfront.net/{{ dcv_version }}/Servers/nice-dcv-{{ dcv_version }}-{{ dcv_build }}-amzn2023-x86_64.tgz"
    dest: /tmp/nice-dcv.tgz
    mode: "0644"
    checksum: "{% if dcv_tarball_sha256 | length > 0 %}sha256:{{ dcv_tarball_sha256 }}{% else %}{% endif %}"
  when: dcv_tarball_sha256 | length > 0

- name: Download Amazon DCV tarball (no checksum)
  get_url:
    url: "https://d1uj6qtbmh3dt5.cloudfront.net/{{ dcv_version }}/Servers/nice-dcv-{{ dcv_version }}-{{ dcv_build }}-amzn2023-x86_64.tgz"
    dest: /tmp/nice-dcv.tgz
    mode: "0644"
  when: not (dcv_tarball_sha256 | length > 0)

- name: Create DCV extract directory
  file:
    path: /tmp/dcv-extract
    state: directory
    mode: "0755"

- name: Extract DCV tarball
  unarchive:
    src: /tmp/nice-dcv.tgz
    dest: /tmp/dcv-extract
    remote_src: true
    extra_opts:
      - "--strip-components=1"

# --- Install DCV RPMs from extracted tarball ---

- name: Find nice-dcv-server RPM
  find:
    paths: /tmp/dcv-extract
    patterns: "nice-dcv-server-*.rpm"
    file_type: file
  register: dcv_server_rpm

- name: Find nice-xdcv RPM
  find:
    paths: /tmp/dcv-extract
    patterns: "nice-xdcv-*.rpm"
    file_type: file
  register: dcv_xdcv_rpm

- name: Find nice-dcv-web-viewer RPM
  find:
    paths: /tmp/dcv-extract
    patterns: "nice-dcv-web-viewer-*.rpm"
    file_type: file
  register: dcv_webviewer_rpm

- name: Install DCV RPMs (nice-dcv-server, nice-xdcv, nice-dcv-web-viewer)
  dnf:
    name:
      - "{{ dcv_server_rpm.files[0].path }}"
      - "{{ dcv_xdcv_rpm.files[0].path }}"
      - "{{ dcv_webviewer_rpm.files[0].path }}"
    state: present
    disable_gpg_check: false

# --- Configure DCV ---

- name: Install DCV configuration file
  template:
    src: dcv.conf.j2
    dest: /etc/dcv/dcv.conf
    mode: "0644"
  notify: reload systemd

# --- DCV virtual session systemd unit ---

- name: Install DCV virtual session systemd service
  template:
    src: dcv-virtual-session.service.j2
    dest: /etc/systemd/system/dcv-virtual-session.service
    mode: "0644"
  notify: reload systemd

- name: Enable dcvserver service
  systemd:
    name: dcvserver
    enabled: true
    daemon_reload: true

- name: Enable DCV virtual session service
  systemd:
    name: dcv-virtual-session
    enabled: true
    daemon_reload: true

# --- Cleanup ---

- name: Clean up DCV temporary files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/nice-dcv.tgz
    - /tmp/dcv-extract
