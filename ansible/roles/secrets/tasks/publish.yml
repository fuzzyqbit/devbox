---
- name: Assert devbox_user is set (publish target requires it)
  ansible.builtin.assert:
    that:
      - devbox_user is defined
      - devbox_user | length > 0
      - devbox_user is match("^[a-z_][a-z0-9_-]*$")
    fail_msg: >-
      devbox_user is required for SSM publish. Pass via Packer extra-vars:
      `--var devbox_user=<name>` (see packer/devimage.pkr.hcl).
    quiet: true

- name: Assert aws_region is set (SSM API target)
  ansible.builtin.assert:
    that:
      - aws_region is defined
      - aws_region | length > 0
    fail_msg: "aws_region is required for SSM publish. Pass via Packer extra-vars."
    quiet: true

- name: Publish code-server password to SSM Parameter Store (SecureString)
  community.aws.ssm_parameter:
    name: "{{ secrets_ssm_code_server_param }}"
    description: "code-server password for {{ devbox_user }} devbox (build {{ ansible_date_time.iso8601 }})"
    string_type: SecureString
    value: "{{ code_server_password }}"
    overwrite_value: always
    region: "{{ aws_region }}"
  no_log: true

- name: Publish VNC password to SSM Parameter Store (SecureString)
  community.aws.ssm_parameter:
    name: "{{ secrets_ssm_vnc_param }}"
    description: "VNC password for {{ devbox_user }} devbox (build {{ ansible_date_time.iso8601 }})"
    string_type: SecureString
    value: "{{ desktop_vnc_password }}"
    overwrite_value: always
    region: "{{ aws_region }}"
  no_log: true

- name: Publish Jupyter password to SSM Parameter Store (SecureString)
  community.aws.ssm_parameter:
    name: "{{ secrets_ssm_jupyter_param }}"
    description: "JupyterLab password for {{ devbox_user }} devbox (build {{ ansible_date_time.iso8601 }})"
    string_type: SecureString
    value: "{{ jupyter_password }}"
    overwrite_value: always
    region: "{{ aws_region }}"
  no_log: true
