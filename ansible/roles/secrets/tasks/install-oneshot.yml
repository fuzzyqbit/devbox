---
- name: Install boot-time secret bootstrap script
  ansible.builtin.template:
    src: devbox-secrets-bootstrap.sh.j2
    dest: /usr/local/sbin/devbox-secrets-bootstrap.sh
    owner: root
    group: root
    mode: "0755"

- name: Install boot-time secret bootstrap systemd unit
  ansible.builtin.template:
    src: devbox-secrets-bootstrap.service.j2
    dest: /etc/systemd/system/devbox-secrets-bootstrap.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Pre-create /var/lib/devbox directory (oneshot guard path)
  ansible.builtin.file:
    path: /var/lib/devbox
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure /var/lib/devbox/secrets-applied does NOT exist in the AMI snapshot
  # Defensive: if a prior bake left the marker, the unit would skip rotation on every
  # new instance launched from this AMI.
  ansible.builtin.file:
    path: /var/lib/devbox/secrets-applied
    state: absent

- name: Enable boot-time secret bootstrap service
  ansible.builtin.systemd:
    name: devbox-secrets-bootstrap.service
    enabled: true
    daemon_reload: true
