---
# --- GNOME Desktop ---

- name: Install GNOME desktop group
  ansible.builtin.dnf:
    name: "@Desktop"
    state: present

- name: Install additional desktop packages
  ansible.builtin.dnf:
    name:
      - gnome-shell
      # gnome-session provides /usr/bin/gnome-session, the binary the DCV session launcher
      # execs to render the GNOME desktop over Amazon DCV; AL2023-core (the Debian "-xsession"
      # variant does not exist here).
      - gnome-session
      - dejavu-sans-fonts
      - dejavu-sans-mono-fonts
      - mesa-dri-drivers
      # chromium — browser for the GNOME desktop. From SPAL (enabled in the base role),
      # not AL2023 core; the Amazon-signed SPAL GPG key was imported by spal-release.
      - chromium
    state: present

# --- GNOME screensaver: disable lock screen (a locked GNOME session is unusable over a
# headless Amazon DCV connection — the operator has no local console to unlock it) ---

- name: Create dconf local profile directory
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/locks
    state: directory
    mode: "0755"

- name: Disable GNOME screen lock via dconf system defaults
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/01-screensaver
    content: |
      [org/gnome/desktop/screensaver]
      lock-enabled=false

      [org/gnome/desktop/session]
      idle-delay=uint32 0
    mode: "0644"

- name: Lock screensaver settings so users cannot re-enable lock
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/locks/screensaver
    content: |
      /org/gnome/desktop/screensaver/lock-enabled
      /org/gnome/desktop/session/idle-delay
    mode: "0644"

- name: Apply dconf system defaults
  ansible.builtin.command: dconf update
  changed_when: true # regenerates the dconf db from the files written above

- name: Download ffmpeg static build
  ansible.builtin.get_url:
    url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
    dest: /tmp/ffmpeg-static.tar.xz
    mode: "0644"

- name: Create ffmpeg extract directory
  ansible.builtin.file:
    path: /tmp/ffmpeg-extract
    state: directory
    mode: "0755"

- name: Extract ffmpeg archive
  ansible.builtin.unarchive:
    src: /tmp/ffmpeg-static.tar.xz
    dest: /tmp/ffmpeg-extract
    remote_src: true

- name: Find ffmpeg binary
  ansible.builtin.find:
    paths: /tmp/ffmpeg-extract
    patterns: "ffmpeg"
    recurse: true
    file_type: file
  register: ffmpeg_bin

- name: Find ffprobe binary
  ansible.builtin.find:
    paths: /tmp/ffmpeg-extract
    patterns: "ffprobe"
    recurse: true
    file_type: file
  register: ffprobe_bin

- name: Install ffmpeg binary
  ansible.builtin.copy:
    src: "{{ ffmpeg_bin.files[0].path }}"
    dest: /usr/local/bin/ffmpeg
    remote_src: true
    mode: "0755"

- name: Install ffprobe binary
  ansible.builtin.copy:
    src: "{{ ffprobe_bin.files[0].path }}"
    dest: /usr/local/bin/ffprobe
    remote_src: true
    mode: "0755"

- name: Clean up ffmpeg archive
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/ffmpeg-static.tar.xz
    - /tmp/ffmpeg-extract

# --- VLC (flatpak — not in AL2023 base repos) ---
- name: Install flatpak
  ansible.builtin.dnf:
    name: flatpak
    state: present

- name: Add Flathub remote
  ansible.builtin.command: flatpak remote-add --if-not-exists --system flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  changed_when: false

- name: Install VLC via flatpak
  ansible.builtin.command: flatpak install --system -y flathub org.videolan.VLC
  args:
    creates: /var/lib/flatpak/app/org.videolan.VLC

# --- Visual Studio Code (desktop editor for the DCV GNOME session) ---
# Pinned versioned RPM via get_url (reproducible) — NOT the packages.microsoft.com yum repo,
# which has autorefresh=1 and would pull a different VS Code on every bake. Microsoft signs the
# RPM: import the MS GPG key and install with signature verification ON (disable_gpg_check: false,
# unlike the unsigned code-server RPM). Public vendor download (redirects to the MS CDN) — airgap
# policy is github/vendor downloads, no S3, no private mirror. /usr/bin/code is the installed binary.
# Toggle with layers.vscode_desktop (layer_config.yml); defaults on when the desktop layer is built.
- name: Install Visual Studio Code desktop editor
  when: layers.vscode_desktop | default(true)
  block:
    - name: Import Microsoft GPG key (VS Code)
      ansible.builtin.rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Download Visual Studio Code RPM (pinned)
      ansible.builtin.get_url:
        url: "https://update.code.visualstudio.com/{{ vscode_desktop_version }}/linux-rpm-x64/stable"
        dest: /tmp/vscode.rpm
        mode: "0644"

    - name: Install Visual Studio Code
      ansible.builtin.dnf:
        name: /tmp/vscode.rpm
        state: present
        disable_gpg_check: false

    - name: Clean up VS Code RPM
      ansible.builtin.file:
        path: /tmp/vscode.rpm
        state: absent

# --- Google Chrome (CHROME-02) — from Google's official signed dnf repo ---
# Unconditional desktop content: gated ONLY by the role-level layers.desktop gate in
# playbook.yml (operator decision — no vscode_desktop-style sub-flag). Latest-at-bake:
# Google's repo hosts only the current stable (historic RPMs are not hosted); remediation
# for a bad version is a rebake (SPAL precedent, CLAUDE.md §8). The .repo content below is
# byte-identical to what the Chrome RPM's %post writes (chromium.googlesource.com
# chrome/installer/linux/common/rpm.include install_yum), so the RPM's unconditional
# overwrite of this file at install is a content no-op and the daily google-chrome cron
# finds nothing to "fix". GPG verification stays ON (CLAUDE.md §2/§8).

- name: Import the Google Linux signing key (Chrome)
  # Multi-key bundle (active EB4C 1BFD 4F04 2F6D DDCC EC91 7721 F63B D38B 4796 + obsolete
  # 4CCA 1EAF 950C EE4A B839 76DC A040 830F 7FAC 5991 — google.com/linuxrepositories).
  # No fingerprint pin — ansible-core < 2.18 rpm_key verifies a single fingerprint against
  # the bundle's first key and can mismatch; a plain import lands all keys on a fresh
  # image (same idiom as the MS key above).
  ansible.builtin.rpm_key:
    key: https://dl.google.com/linux/linux_signing_key.pub
    state: present

- name: Bake the Google Chrome dnf repo config (gpgcheck on)
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/google-chrome.repo
    content: |
      [google-chrome]
      name=google-chrome
      baseurl=https://dl.google.com/linux/chrome/rpm/stable/x86_64
      enabled=1
      gpgcheck=1
      gpgkey=https://dl.google.com/linux/linux_signing_key.pub
    owner: root
    group: root
    mode: "0644"

- name: Install Google Chrome (latest-at-bake from the signed repo)
  # disable_gpg_check stays false — the Google key imported above verifies the signature.
  # GPG verification stays ON (CLAUDE.md §2/§8).
  ansible.builtin.dnf:
    name: google-chrome-stable
    state: present
    disable_gpg_check: false
