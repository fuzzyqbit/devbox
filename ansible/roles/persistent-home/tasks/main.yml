---
# persistent-home role — provisions the persistent /data backup volume + the MANUAL home
# save/restore scripts. /home persistence is via `./run save-home`/`restore-home` (manual rsync
# to/from the persistent /data volume), NOT a live mount over /home. This deliberately replaces
# the old mount-over-/home + first-boot seed design (which caused shadowing/seed/ownership traps).
# Wired into playbook.yml BEFORE hardening (hardening-stays-last invariant).

- name: Install rsync (used by the home save/restore scripts)
  ansible.builtin.dnf:
    name: rsync
    state: present

- name: Create the /data mountpoint
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the /data mount script
  ansible.builtin.copy:
    src: devbox-data-mount.sh
    dest: /usr/local/sbin/devbox-data-mount.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the home save + restore scripts (run on the instance via ./run save-home/restore-home)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - devbox-home-save.sh
    - devbox-home-restore.sh

- name: Install the /data mount systemd unit
  ansible.builtin.template:
    src: devbox-data-mount.service.j2
    dest: /etc/systemd/system/devbox-data-mount.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable the /data mount unit (runs at instance boot, not at bake)
  ansible.builtin.systemd:
    name: devbox-data-mount
    enabled: true
    daemon_reload: true
