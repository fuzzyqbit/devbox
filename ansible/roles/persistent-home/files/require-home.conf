# Installed by the persistent-home role as a drop-in on the /home-consuming units
# (code-server, dcv-virtual-session). Fail-closed: the consumer must not start — and serve
# the operator's home — until the persistent /home EBS volume is mounted. If the volume never
# attaches, devbox-home-mount.service fails and this unit is blocked, a loud signal that beats
# silently serving (and later losing) data on the disposable root volume.
#
# This lives in the persistent-home role (not the consumers' base units) so the coupling
# exists ONLY when the persistent_home layer is built. With the layer off, no drop-in is
# installed and the consumers behave as before (ephemeral home).
[Unit]
Requires=devbox-home-mount.service
After=devbox-home-mount.service
