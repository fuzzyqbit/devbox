---
- name: Install devtools from dnf
  dnf:
    name: "{{ devtools_dnf_packages }}"
    state: present

# --- ShellCheck (not in AL2023 repos, install from GitHub) ---
- name: Download ShellCheck {{ shellcheck_version }}
  get_url:
    url: "https://github.com/koalaman/shellcheck/releases/download/v{{ shellcheck_version }}/shellcheck-v{{ shellcheck_version }}.linux.x86_64.tar.xz"
    dest: /tmp/shellcheck.tar.xz
    mode: "0644"

- name: Extract ShellCheck
  unarchive:
    src: /tmp/shellcheck.tar.xz
    dest: /tmp
    remote_src: true

- name: Install ShellCheck binary
  copy:
    src: "/tmp/shellcheck-v{{ shellcheck_version }}/shellcheck"
    dest: /usr/local/bin/shellcheck
    remote_src: true
    mode: "0755"

- name: Clean up ShellCheck
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/shellcheck.tar.xz
    - "/tmp/shellcheck-v{{ shellcheck_version }}"

# --- ripgrep ---
- name: Download ripgrep
  get_url:
    url: "https://github.com/BurntSushi/ripgrep/releases/download/{{ ripgrep_version }}/ripgrep-{{ ripgrep_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: /tmp/ripgrep.tar.gz
    mode: "0644"

- name: Create temp dir for ripgrep
  file:
    path: /tmp/ripgrep-extract
    state: directory
    mode: "0755"

- name: Extract ripgrep
  unarchive:
    src: /tmp/ripgrep.tar.gz
    dest: /tmp/ripgrep-extract
    remote_src: true

- name: Install ripgrep binary
  copy:
    src: "/tmp/ripgrep-extract/ripgrep-{{ ripgrep_version }}-x86_64-unknown-linux-musl/rg"
    dest: /usr/local/bin/rg
    remote_src: true
    mode: "0755"

- name: Clean up ripgrep
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/ripgrep.tar.gz
    - /tmp/ripgrep-extract

