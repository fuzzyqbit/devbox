# --- fzf ---
- name: Download fzf
  ansible.builtin.get_url:
    url: "https://github.com/junegunn/fzf/releases/download/v{{ fzf_version }}/fzf-{{ fzf_version }}-linux_amd64.tar.gz"
    dest: /tmp/fzf.tar.gz
    mode: "0644"

- name: Install fzf
  ansible.builtin.unarchive:
    src: /tmp/fzf.tar.gz
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"

- name: Clean up fzf archive
  ansible.builtin.file:
    path: /tmp/fzf.tar.gz
    state: absent

- name: Add fzf key bindings to bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'eval "$(fzf --bash)"'
    regexp: "fzf --bash"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"

# --- yq ---
- name: Download yq
  ansible.builtin.get_url:
    url: "https://github.com/mikefarah/yq/releases/download/v{{ yq_version }}/yq_linux_amd64"
    dest: /usr/local/bin/yq
    mode: "0755"

# --- direnv ---
- name: Install direnv
  when: direnv_install
  block:
    - name: Download direnv
      ansible.builtin.get_url:
        url: https://direnv.net/install.sh
        dest: /tmp/direnv-install.sh
        mode: "0755"

    - name: Install direnv binary
      ansible.builtin.command: bash /tmp/direnv-install.sh
      environment:
        bin_path: /usr/local/bin
      args:
        creates: /usr/local/bin/direnv

    - name: Add direnv hook to bashrc
      ansible.builtin.lineinfile:
        path: "{{ dev_home }}/.bashrc"
        line: 'eval "$(direnv hook bash)"'
        regexp: "direnv hook"
        owner: "{{ dev_user }}"
        group: "{{ dev_user }}"

# --- Apache Thrift compiler (no pre-built Linux binaries; build compiler only) ---
- name: Install Thrift build dependencies
  ansible.builtin.dnf:
    name:
      - boost-devel
      - flex
      - bison
    state: present

- name: Download Thrift source {{ thrift_version }}
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/thrift/{{ thrift_version }}/thrift-{{ thrift_version }}.tar.gz"
    dest: /tmp/thrift.tar.gz
    mode: "0644"

- name: Extract Thrift source
  ansible.builtin.unarchive:
    src: /tmp/thrift.tar.gz
    dest: /tmp
    remote_src: true

- name: Configure Thrift (compiler only, all language libs disabled)
  ansible.builtin.command: >
    ./configure
    --prefix=/usr/local
    --without-c_glib
    --without-java
    --without-python
    --without-ruby
    --without-nodejs
    --without-go
    --without-erlang
    --without-lua
    --without-php
    --without-perl
    --without-dotnetcore
    --without-swift
    --without-rs
    --without-qt4
    --without-qt5
    --without-haskell
    --without-d
    --without-csharp
    --disable-tests
    --disable-tutorial
  args:
    chdir: "/tmp/thrift-{{ thrift_version }}"
    creates: "/tmp/thrift-{{ thrift_version }}/Makefile"

- name: Build Thrift compiler binary
  ansible.builtin.command: make -j{{ ansible_processor_vcpus | default(2) }} -C compiler/cpp
  args:
    chdir: "/tmp/thrift-{{ thrift_version }}"
    creates: "/tmp/thrift-{{ thrift_version }}/compiler/cpp/thrift"

- name: Find built thrift binary
  ansible.builtin.find:
    paths: "/tmp/thrift-{{ thrift_version }}/compiler/cpp"
    patterns: "thrift"
    recurse: false
    file_type: file
  register: thrift_bin

- name: Install thrift binary
  ansible.builtin.copy:
    src: "{{ thrift_bin.files[0].path }}"
    dest: /usr/local/bin/thrift
    remote_src: true
    mode: "0755"

- name: Clean up Thrift source
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/thrift.tar.gz
    - "/tmp/thrift-{{ thrift_version }}"

# --- Bazel (via bazelisk launcher) ---
- name: Download bazelisk-as-bazel {{ bazelisk_version }}
  ansible.builtin.get_url:
    url: "https://github.com/bazelbuild/bazelisk/releases/download/v{{ bazelisk_version }}/bazelisk-linux-amd64"
    dest: /usr/local/bin/bazel
    mode: "0755"

# --- nvm (Node Version Manager) ---
- name: Download nvm install script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh"
    dest: /tmp/nvm-install.sh
    mode: "0755"

- name: Install nvm for {{ dev_user }}
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.command: bash /tmp/nvm-install.sh
  args:
    creates: "{{ dev_home }}/.nvm/nvm.sh"

- name: Clean up nvm install script
  ansible.builtin.file:
    path: /tmp/nvm-install.sh
    state: absent

# --- Sublime Text ---
- name: Import Sublime Text GPG key
  ansible.builtin.rpm_key:
    key: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    state: present

- name: Add Sublime Text repository
  ansible.builtin.get_url:
    url: https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo
    dest: /etc/yum.repos.d/sublime-text.repo
    mode: "0644"

- name: Install Sublime Text
  ansible.builtin.dnf:
    name: sublime-text
    state: present

# --- JupyterLab (developer tool; Phase 8 JUP-01, folded in from the standalone jupyter role) ---
# Loopback-only, on-demand JupyterLab venv. Launched via `./run jupyter`
# (127.0.0.1:8888) and reached over an SSM port-forward — no systemd service,
# no TLS, no password (SSM/IAM is the auth boundary). Built from the AL2023
# system python3 (3.9); ipykernel pinned to a 3.9-compatible release.
- name: Create Jupyter virtualenv
  ansible.builtin.command:
    cmd: "python3 -m venv {{ jupyter_venv_path }}"
    creates: "{{ jupyter_venv_path }}/bin/python3"

- name: Upgrade pip in Jupyter venv
  ansible.builtin.command:
    cmd: "{{ jupyter_venv_path }}/bin/pip install --upgrade pip"
  register: jupyter_pip_upgrade
  changed_when: "'Successfully installed' in jupyter_pip_upgrade.stdout"

- name: Install JupyterLab and ipykernel into venv
  ansible.builtin.command:
    cmd: >
      {{ jupyter_venv_path }}/bin/pip install
      jupyterlab=={{ jupyterlab_version }}
      ipykernel=={{ ipykernel_version }}
    creates: "{{ jupyter_venv_path }}/bin/jupyter"

- name: Register Python kernel into venv prefix
  ansible.builtin.command:
    cmd: "{{ jupyter_venv_path }}/bin/python3 -m ipykernel install --prefix {{ jupyter_venv_path }} --name python3 --display-name 'Python 3'"
    creates: "{{ jupyter_venv_path }}/share/jupyter/kernels/python3/kernel.json"
