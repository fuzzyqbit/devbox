---
- name: Install Python packages
  ansible.builtin.dnf:
    name: "{{ python_packages }}"
    state: present

- name: Install pipx
  ansible.builtin.pip:
    name: pipx
    executable: pip3
    state: present

- name: Ensure pipx path
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.command: python3 -m pipx ensurepath
  changed_when: false

- name: Install Python CLI tools via pipx
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.command: "python3 -m pipx install {{ item }}"
  args:
    creates: "{{ dev_home }}/.local/bin/{{ item }}"
  loop: "{{ pipx_tools }}"

# --- uv + uvx (standalone binary, faster than pipx-based install) ---
- name: Download uv {{ uv_version }}
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-unknown-linux-musl.tar.gz"
    dest: /tmp/uv.tar.gz
    mode: "0644"

- name: Create uv extract directory
  ansible.builtin.file:
    path: /tmp/uv-extract
    state: directory
    mode: "0755"

- name: Extract uv archive
  ansible.builtin.unarchive:
    src: /tmp/uv.tar.gz
    dest: /tmp/uv-extract
    remote_src: true
    extra_opts:
      - --strip-components=1

- name: Install uv binary
  ansible.builtin.copy:
    src: /tmp/uv-extract/uv
    dest: /usr/local/bin/uv
    remote_src: true
    mode: "0755"

- name: Install uvx binary
  ansible.builtin.copy:
    src: /tmp/uv-extract/uvx
    dest: /usr/local/bin/uvx
    remote_src: true
    mode: "0755"

- name: Clean up uv archive
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/uv.tar.gz
    - /tmp/uv-extract

# --- virtualenvwrapper ---
# Installed per-user (not system-wide). Reasons:
#   1. virtualenvwrapper is a shell helper for one user's venv workflow,
#      not a system tool — install scope should match usage scope.
#   2. The CIS hardening role sets system umask to 027, so a root-run
#      `pip install` lands files mode 0640/0750 under /usr/local, making
#      them unreadable to ec2-user. Per-user install sidesteps this.
- name: Install virtualenvwrapper for dev user
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.pip:
    name: virtualenvwrapper
    executable: pip3
    extra_args: --user
    state: present

- name: Configure virtualenvwrapper in bashrc
  ansible.builtin.blockinfile:
    path: "{{ dev_home }}/.bashrc"
    block: |
      export WORKON_HOME=$HOME/.virtualenvs
      export VIRTUALENVWRAPPER_PYTHON=$(which python3)
      source $(which virtualenvwrapper.sh)
    marker: "# {mark} ANSIBLE MANAGED BLOCK - virtualenvwrapper"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
