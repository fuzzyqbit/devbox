---
# SPAL (Supplementary Packages for Amazon Linux) system-release floor. SPAL is only on
# AL2023 >= this; older AMIs have no spal-release package.
# https://docs.aws.amazon.com/linux/al2023/ug/configure-spal-repository.html
spal_min_system_release: "2023.9.20251117"

base_packages:
  - wget
  - unzip
  - tar
  - gzip
  - bzip2
  - xz
  - jq
  - htop
  - tmux
  - tree
  - make
  - cmake
  - gcc
  - gcc-c++
  - openssl-devel
  - zlib-devel
  - bzip2-devel
  - readline-devel
  - sqlite-devel
  - libffi-devel
  - xz-devel
  - ncurses-devel
  - patch
  - diffutils
  - which
  - man-db
  - bash-completion
  - procps-ng
  - net-tools
  - bind-utils
  - iputils
  - strace
  - lsof
  - socat

awscli_install: true

starship_install: true

sysctl_tuning:
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 1024

dev_user: ec2-user
dev_home: /home/ec2-user
