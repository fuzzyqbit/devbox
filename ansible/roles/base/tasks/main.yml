---
# --- dnf versionlock — freeze salt-minion at its bake-start version ---
# ORDERING: the next task after this block is the bake-time full-image update
# (name: "*" / state: latest). A lock created after that update would capture the
# post-update version — wrong — so this block MUST stay first in the role. The
# versionlock plugin filters the dnf sack, and ansible.builtin.dnf loads plugins by
# default, so the update task honors the lock (do not disable plugins on any task here).
# SOURCE AMI: no role in this repo installs salt-minion; it ships on the org's source
# AMI (or arrives at runtime). The lock is therefore conditional — a bake from the
# public AL2023 minimal AMI has no salt-minion and no-ops cleanly (per-item skip plus
# a debug note).
# PLUGIN NAME: python3-dnf-plugin-versionlock is the dnf4 subpackage name on the
# AL2023/EL9 family (AL2023 ships dnf 4.x for its lifetime). Provider-agnostic fallback
# spec if a future AMI reports "no match": dnf-command(versionlock) — noted here only,
# no fallback path coded (YAGNI). GPG check stays ON (dnf default — CLAUDE.md §8).
# UNLOCK / REMEDIATION: `dnf versionlock delete salt-minion` then update as usual, or
# rebake — the next bake re-captures the source AMI's then-current version.
- name: Install dnf versionlock plugin
  ansible.builtin.dnf:
    name: python3-dnf-plugin-versionlock
    state: present

# Pre-update facts feed the per-item presence gate below. The LATER package_facts
# gather in this file (SPAL system-release floor) deliberately re-collects POST-update
# facts — do not deduplicate the two gathers.
- name: Gather package facts for the versionlock gate
  ansible.builtin.package_facts:
    manager: auto

- name: Lock packages to their currently installed versions
  ansible.builtin.command:
    cmd: dnf versionlock add {{ item }}
  loop: "{{ dnf_versionlock_packages }}"
  when: item in ansible_facts.packages
  register: versionlock_add
  changed_when: "'Adding versionlock on:' in versionlock_add.stdout"
  failed_when: versionlock_add.rc != 0 and 'already locked' not in (versionlock_add.stdout + versionlock_add.stderr)

- name: Note packages absent from this source AMI (versionlock skipped)
  ansible.builtin.debug:
    msg: >-
      {{ item }} is not installed on this source AMI — versionlock skipped. This is
      expected on the public AL2023 minimal AMI; salt-minion comes from the org's
      source AMI.
  loop: "{{ dnf_versionlock_packages }}"
  when: item not in ansible_facts.packages

- name: Update all packages # noqa: package-latest (bake-time full-image update is the intent)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Swap curl-minimal for full curl
  ansible.builtin.command: dnf swap -y curl-minimal curl
  args:
    removes: /usr/bin/curl
  register: curl_swap
  changed_when: "'Nothing to do' not in curl_swap.stdout"
  failed_when: curl_swap.rc != 0 and 'already installed' not in curl_swap.stderr

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present

# --- SPAL (Supplementary Packages for Amazon Linux) — enable image-wide ---
# SPAL is the AL2023 EPEL9 rebuild; enabling it in `base` makes its packages (chromium,
# xrdp/xorgxrdp, …) available to every later role. `dnf install spal-release` drops
# /etc/yum.repos.d/amazonlinux-spal.repo and imports the Amazon-signed SPAL GPG keys (GPG
# stays ON — CLAUDE.md §8 airgap posture). Assert the system-release floor first so an old
# AMI fails loudly instead of `dnf install spal-release` erroring cryptically.
- name: Gather package facts for the SPAL system-release floor gate
  ansible.builtin.package_facts:
    manager: auto

- name: Assert the AL2023 system-release meets the SPAL version floor
  ansible.builtin.assert:
    that:
      - ansible_facts.packages['system-release'][0].version is version(spal_min_system_release, '>=', version_type='loose')
    fail_msg: >-
      This AMI's system-release
      ({{ ansible_facts.packages['system-release'][0].version | default('absent') }}) is BELOW
      the SPAL floor ({{ spal_min_system_release }}). SPAL is only available on
      AL2023 >= {{ spal_min_system_release }}; older images have no `spal-release` package.
      Rebake from a newer AL2023 source AMI (or `sudo dnf upgrade`) and retry.
      https://docs.aws.amazon.com/linux/al2023/ug/configure-spal-repository.html
    quiet: true

- name: Enable SPAL via the Amazon-signed spal-release package
  ansible.builtin.dnf:
    name: spal-release
    state: present
    disable_gpg_check: false

- name: Install AWS CLI v2
  when: awscli_install
  block:
    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"

    - name: Unzip AWS CLI installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Run AWS CLI installer
      ansible.builtin.command: /tmp/aws/install --update
      args:
        creates: /usr/local/bin/aws

    - name: Clean up AWS CLI installer
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws

- name: Install Starship prompt
  when: starship_install
  block:
    - name: Download Starship installer
      ansible.builtin.get_url:
        url: https://starship.rs/install.sh
        dest: /tmp/starship-install.sh
        mode: "0755"

    - name: Install Starship
      ansible.builtin.command: /tmp/starship-install.sh --yes
      args:
        creates: /usr/local/bin/starship

    - name: Add Starship init to bashrc
      ansible.builtin.lineinfile:
        path: "{{ dev_home }}/.bashrc"
        line: 'eval "$(starship init bash)"'
        regexp: "starship init"
        owner: "{{ dev_user }}"
        group: "{{ dev_user }}"

- name: Apply sysctl tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  loop: "{{ sysctl_tuning | dict2items }}"

- name: Set open file limits for dev user
  ansible.builtin.copy:
    content: |
      {{ dev_user }} soft nofile 65536
      {{ dev_user }} hard nofile 65536
    dest: /etc/security/limits.d/99-devimage.conf
    mode: "0644"

- name: Ensure dev user profile directory exists
  ansible.builtin.file:
    path: "{{ dev_home }}/.local/bin"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Add local bin to PATH in bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: "\\.local/bin"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
