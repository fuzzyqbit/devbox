---
- name: Download code-server RPM
  ansible.builtin.get_url:
    url: "https://github.com/coder/code-server/releases/download/v{{ code_server_version }}/code-server-{{ code_server_version }}-amd64.rpm"
    dest: /tmp/code-server.rpm
    mode: "0644"

- name: Install code-server
  ansible.builtin.dnf:
    name: /tmp/code-server.rpm
    state: present
    disable_gpg_check: true

- name: Clean up RPM
  ansible.builtin.file:
    path: /tmp/code-server.rpm
    state: absent

- name: Create code-server config directory
  ansible.builtin.file:
    path: "{{ dev_home }}/.config/code-server"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Write code-server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ dev_home }}/.config/code-server/config.yaml"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"

- name: Install code-server systemd service
  ansible.builtin.template:
    src: code-server.service.j2
    dest: /etc/systemd/system/code-server.service
    mode: "0644"
  notify: Reload systemd

- name: Enable code-server service
  ansible.builtin.systemd:
    name: code-server
    enabled: true
    daemon_reload: true

- name: Install VS Code extensions
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.command: "code-server --install-extension {{ item }}"
  loop: "{{ code_server_extensions }}"
  changed_when: false
  # Extensions are best-effort at bake (marketplace flakiness must not fail the AMI);
  # failed_when: false replaces ignore_errors so the task cannot mask other error kinds.
  failed_when: false
