# Checkov configuration for Phase 4 (CI-06)
#
# Source: RESEARCH §"Pattern 5" (lines 448-461) — IaC security scan with
#         severity-graded failure semantics.
#
# Semantics (per checkov docs, https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html):
#   hard-fail-on: severity threshold that returns non-zero exit (gates CI).
#                 "HIGH" includes HIGH and CRITICAL findings.
#   soft-fail-on: severity threshold that emits a finding but exits zero
#                 (reported as informational; does NOT block merge).
#
# Policy on skip-check entries: EVERY skip MUST carry an inline comment
# explaining the carve-out (which Phase finding, why accepted, follow-up
# ticket if applicable). Triage real findings here as they emerge — do
# NOT add IDs preemptively. RESEARCH Assumption A3 (line 645) notes that
# the post-Phase-3 tree may surface HIGH findings on first run; capture
# them in the plan's SUMMARY and triage with an explicit follow-up commit.

framework: terraform

directory:
  - terraform/

hard-fail-on: HIGH
soft-fail-on: MEDIUM

# Add entries ONLY with a comment explaining the carve-out.
skip-check:
  # Detailed (1-min) CloudWatch monitoring is paid per-metric; this is a single-operator
  # devbox that is stopped most of the time and observability is an explicit v3-backlog
  # item (STATE.md "Deferred"). Basic 5-min monitoring suffices; revisit with that backlog.
  - CKV_AWS_126
  # Both the root volume and the persistent /home volume ARE encrypted (encrypted = true,
  # AWS-managed aws/ebs key). A customer-managed KMS CMK adds $1/mo + per-request cost and
  # key-lifecycle burden with no threat-model benefit for a single-operator box (no
  # cross-account sharing, no key-rotation policy requirement). Aligns with the repo's
  # cost posture (DLM backup layer dropped for unwanted spend).
  - CKV_AWS_189
  # All-ports egress to 0.0.0.0/0 is deliberate: the box has NO public ingress
  # (SSM-only + CIDR-allowlisted web ports) and needs broad egress for SSM
  # endpoints, dnf/SPAL repos, galaxy, and the CloudFront DCV tarball. Matches
  # the SSM-only posture carve-out anticipated by this file's original example.
  # (Flagged by checkov >= 3.3 locally; the SHA-pinned CI action does not flag
  # it yet — skip recorded ahead of an action bump.)
  - CKV_AWS_382

# Run quietly in CI — full findings are written to the runner log via
# checkov-action's default output handler.
quiet: false
compact: true
