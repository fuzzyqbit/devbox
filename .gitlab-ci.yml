# =============================================================================
# .gitlab-ci.yml — OpenTofu apply pipeline for the devbox project.
#
# Stages
#   1. validate   8 parallel gates against the source tree:
#                 tofu-fmt, packer-fmt, tofu-validate (-lockfile=readonly),
#                 packer-validate, ansible-lint, ansible-syntax,
#                 shellcheck, checkov, grep-gates.
#   2. deploy     `tofu init -lockfile=readonly` + `tofu apply` provisions
#                 the EC2 instance from the latest AMI matched by the
#                 `data "aws_ami"` filter in terraform/main.tf.
#                 `when: manual` on protected branches ONLY — provisions
#                 real AWS resources, so a human must click "play".
#
# AMI sourcing: AMIs are baked OUT-OF-BAND (operator runs `make build` on a
# workstation with AWS creds). Deploy picks the most-recent matching AMI via
# the terraform `data "aws_ami"` filter. CI does NOT run packer build.
#
# AWS authentication: GitLab OIDC federation (`id_tokens:` →
# `sts assume-role-with-web-identity`). No static IAM keys touch CI vars.
# See trust-policy block below; the IAM role binds the OIDC `sub` to a
# specific project_path + protected branch, and `aud` to this GitLab
# instance (T-be1-01).
#
# Image digest-pin policy: every `image:` line MUST be
# `name@sha256:<64-hex>`. The validate:grep-gates job's invariant #7 fails
# the pipeline if anyone regresses this (T-be1-02). To rotate a digest,
# re-resolve via `docker manifest inspect <image>:<tag>` (or
# `crane digest <image>:<tag>`) and replace the existing digest in this file.
#
# Required GitLab CI/CD variables (Settings → CI/CD → Variables)
#   AWS_ROLE_ARN     masked, protected      IAM role for OIDC AssumeRole
#   AWS_REGION       protected              e.g. us-east-1
#   DEVBOX_USER      protected              operator identity (NO whoami default)
#   TF_STATE_BUCKET  protected              S3 backend bucket
#   AWS_OIDC_AUD     protected, OPTIONAL    default: https://gitlab.com
#
# IAM Trust Policy (paste into the role AWS_ROLE_ARN resolves to)
# Replace <ACCT>, <group>, <project> with literal values. The
# `gitlab.com:sub` condition scopes the role to ONE project + main branch:
#
#   {
#     "Version": "2012-10-17",
#     "Statement": [{
#       "Effect": "Allow",
#       "Principal": { "Federated": "arn:aws:iam::<ACCT>:oidc-provider/gitlab.com" },
#       "Action": "sts:AssumeRoleWithWebIdentity",
#       "Condition": {
#         "StringEquals": { "gitlab.com:aud": "https://gitlab.com" },
#         "StringLike":   { "gitlab.com:sub": "project_path:<group>/<project>:ref_type:branch:ref:main" }
#       }
#     }]
#   }
#
# Checkov severity policy: sourced from .checkov.yaml in the repo root
# (hard-fail-on HIGH, soft-fail-on MEDIUM). DO NOT duplicate those flags
# in the job scripts — drift hazard. Every skip-check needs an inline
# justification comment per .checkov.yaml §"Policy on skip-check entries".
# =============================================================================

stages:
  - validate
  - deploy

variables:
  # IaC binary. tofu is canonical — terraform/.terraform.lock.hcl is
  # OpenTofu-flavoured per Phase 3 REP-01.
  TF_BIN: tofu

  # Backend coordinates threaded into deploy:tofu-apply. Mirrors Makefile
  # lines 37-52 exactly (Phase 5: Terragrunt removed, backend driven by
  # tofu -backend-config flags).
  TF_STATE_REGION: us-east-1
  TF_STATE_LOCK_TABLE: devimage-tfstate-locks
  TF_STATE_KEY: "users/${DEVBOX_USER}/devbox.tfstate"

  # GitLab OIDC audience. Override per self-hosted GitLab instance.
  # The IAM trust-policy `gitlab.com:aud` condition MUST match this.
  AWS_OIDC_AUD: "https://gitlab.com"

default:
  # Markdown-only commits do NOT trigger validate/deploy.
  rules:
    - changes:
        - '**/*.md'
      when: never
    - when: on_success

# -----------------------------------------------------------------------------
# Validate stage — 9 parallel gates, no `needs:` between them (each runs
# against the source tree independently).
# -----------------------------------------------------------------------------

# 1a. tofu fmt -check -recursive
validate:tofu-fmt:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  script:
    - cd terraform
    - tofu fmt -check -recursive

# 1b. packer fmt -check. Split from tofu-fmt to avoid building a custom
# image that ships both binaries.
validate:packer-fmt:
  stage: validate
  image: hashicorp/packer:1.15.3@sha256:cb9c526a6351c55f05430423a8b37139a04b0fb5ce541887d476e19860b5ed92
  script:
    - cd packer
    - packer fmt -check .

# 2. tofu init (lockfile-readonly) + validate. -backend=false skips S3 —
# validate does not need state access. The -lockfile=readonly flag is the
# Phase-3 REP-01 gate: CI must not silently rewrite the committed lockfile.
validate:tofu-validate:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  script:
    - cd terraform
    - tofu init -lockfile=readonly -backend=false
    - tofu validate

# 3. packer init + validate. var.devbox_user defaults to "" since Phase 3
# fix (commit f156070); no -var flag needed.
validate:packer-validate:
  stage: validate
  image: hashicorp/packer:1.15.3@sha256:cb9c526a6351c55f05430423a8b37139a04b0fb5ce541887d476e19860b5ed92
  script:
    - cd packer
    - packer init .
    - packer validate .

# 4. ansible-lint. The pipelinecomponents image ships ansible-core and
# ansible-lint preinstalled, but collections must be installed before
# lint resolves fqcn references (RESEARCH Pitfall 5).
validate:ansible-lint:
  stage: validate
  image: pipelinecomponents/ansible-lint:0.26.0@sha256:e5944beda2dd60f26d71f78e595be41e3c2f2b97d0cb3a0f748943cb70659502
  script:
    - ansible-galaxy collection install -r ansible/requirements.yml
    - ansible-lint ansible/playbook.yml

# 5. ansible-playbook --syntax-check. SEPARATE job from ansible-lint —
# lint and syntax-check catch different classes of bugs and both satisfy
# CI-04 literally.
validate:ansible-syntax:
  stage: validate
  image: pipelinecomponents/ansible-lint:0.26.0@sha256:e5944beda2dd60f26d71f78e595be41e3c2f2b97d0cb3a0f748943cb70659502
  script:
    - ansible-galaxy collection install -r ansible/requirements.yml
    - ansible-playbook --syntax-check ansible/playbook.yml -i localhost,

# 6. shellcheck on every script in scripts/.
validate:shellcheck:
  stage: validate
  image: koalaman/shellcheck-alpine:v0.10.0@sha256:7c6a5115899d99323b22fc84b29e924aef5b6fa985612e450a8c356969ebb577
  script:
    - shellcheck scripts/*.sh

# 7. Checkov against terraform/. --hard-fail-on HIGH and --soft-fail-on
# MEDIUM are sourced from .checkov.yaml — do NOT re-specify them on the
# command line (drift hazard, see .checkov.yaml header).
validate:checkov:
  stage: validate
  image: bridgecrew/checkov:3.2.527@sha256:22b308dd96e158b446c6080d19ea41ffb609ebd46962c9ace43b9b6c8aaff5cf
  script:
    - checkov --directory terraform/ --framework terraform --config-file .checkov.yaml

# 8. grep-gates. Phase-3 + CI-hardening invariants enforced as a single
# job. Invariant #4 (collection-version pin) uses the comment-filtered
# form: '"==X.Y.Z"' starts with '"' (not '='), so an unfiltered grep on
# `version:` lines without `==` would self-invalidate against legal pins.
#
# Re-uses the opentofu image (already digest-pinned above) since it has
# bash + grep + git — no separate digest to rotate.
validate:grep-gates:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  script:
    - |
      set -euo pipefail

      # 1. Source AMI must not use most_recent=true (REP-04)
      ! grep -rE 'most_recent[[:space:]]*=[[:space:]]*true' packer/

      # 2. No hand-copied AMI ID in terraform.tfvars (REP-05; previously
      #    terragrunt.hcl, removed Phase 5 — the file is gone, the
      #    invariant moved with the inputs)
      ! grep -E '^[[:space:]]*ami_id[[:space:]]*=[[:space:]]*"ami-' terraform/terraform.tfvars

      # 3. No raw <RESOLVED-VERSION> placeholder (REP-06)
      ! grep -r -- '<RESOLVED-VERSION>' packer/

      # 4. No bare collection-version pins (REP-02)
      #    Get non-comment lines that start with 'version:' and whose
      #    value does NOT begin with '==' (quoted or unquoted).
      if grep -vE '^[[:space:]]*#' ansible/requirements.yml \
           | grep -E '^[[:space:]]*version:' \
           | grep -vE 'version:[[:space:]]*"?==' ; then
        echo "FAIL: bare-version pin found in ansible/requirements.yml (REP-02)" >&2
        exit 1
      fi

      # 5. Terraform lockfile is tracked (REP-01)
      git ls-files terraform/.terraform.lock.hcl | grep -q .

      # 6. Lockfile-exclusion not in .gitignore (REP-01 defense)
      ! grep -E '^[^#]*terraform/\.terraform\.lock\.hcl' .gitignore

      # 7. GitLab CI image digest-pin policy.
      #    Every `image:` line in .gitlab-ci.yml MUST be `name@sha256:HEX`.
      #    T-be1-02 mitigation.
      if grep -E '^[[:space:]]*image:[[:space:]]+' .gitlab-ci.yml \
           | grep -v '@sha256:' ; then
        echo "FAIL: unpinned image: line in .gitlab-ci.yml (must use @sha256:HEX)" >&2
        exit 1
      fi

      echo "All 7 invariants pass."

# -----------------------------------------------------------------------------
# .aws-auth template — hidden job (leading dot prefix → GitLab never runs it
# directly). deploy:tofu-apply `extends:` this to inherit the id_tokens +
# sts assume-role-with-web-identity before_script.
#
# Threat model linkage:
#   T-be1-01 (Spoofing): the IAM trust policy in the header MUST scope `sub`
#     (project_path + ref_type + ref) AND `aud` (matching AWS_OIDC_AUD). Without
#     both conditions, any GitLab project on the same instance could request a
#     token and assume the role.
#   T-be1-04 (Repudiation): --role-session-name embeds CI_PROJECT_ID +
#     CI_PIPELINE_ID + CI_JOB_ID so CloudTrail records which pipeline/job
#     triggered each AWS API call.
#   T-be1-05 (Info disclosure): AWS_ROLE_ARN is configured as a Masked +
#     Protected GitLab variable, so it never appears in job logs.
# -----------------------------------------------------------------------------

.aws-auth:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: ${AWS_OIDC_AUD}
  before_script:
    # Smoke test: the inheriting job's `image:` must already ship aws-cli + jq.
    # The opentofu image doesn't ship aws-cli; install if Alpine, else fail
    # loud so the operator picks a better base image.
    - |
      if ! command -v aws >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache aws-cli jq
        else
          echo "FATAL: image is missing aws-cli or jq, and is not Alpine (no apk). Use an image that ships them or override the image:." >&2
          exit 1
        fi
      fi
    - >
      creds=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gl-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$creds" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "$creds" | awk '{print $3}')
    # Smoke test: fail loudly on bad role / aud / sub. The account-ID printed
    # here is low-sensitivity (it's already in TF_STATE_BUCKET — see T-be1-05).
    - aws sts get-caller-identity

# -----------------------------------------------------------------------------
# Deploy stage — tofu apply.
#
# Picks the latest AMI matched by the `data "aws_ami"` filter in
# terraform/main.tf (AMI is baked out-of-band via `make build` on an operator
# workstation; CI does NOT run packer).
#
#   `lockfile=readonly` asserts the committed terraform/.terraform.lock.hcl
#   is the single source of truth for provider versions (Phase-3 REP-01).
#
#   `key_name=${DEVBOX_USER}-devbox` matches Makefile line 47 — the
#   per-operator keypair convention from Phase 1 SEC-04.
#
#   The four `-backend-config` flags mirror Makefile lines 49-52
#   (TF_BACKEND_ARGS) exactly. Any drift here is a bug.
#
# `when: manual` blocks this job until a maintainer clicks "play" in the
# GitLab UI on a protected branch. Combined with the
# `if: $CI_COMMIT_REF_PROTECTED == "true"` rule, the deploy is gated on:
# (a) a human, (b) a protected branch, and (c) someone with deploy
# permission. This is the T-be1-10 mitigation against a hostile MR
# triggering deploy automatically.
# -----------------------------------------------------------------------------

deploy:tofu-apply:
  stage: deploy
  extends: .aws-auth
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  environment:
    name: devbox/${DEVBOX_USER}
  script:
    - cd terraform
    - >
      tofu init -lockfile=readonly
      -backend-config="bucket=${TF_STATE_BUCKET}"
      -backend-config="key=${TF_STATE_KEY}"
      -backend-config="region=${TF_STATE_REGION}"
      -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"
    - >
      tofu plan
      -var "devbox_user=${DEVBOX_USER}"
      -var "key_name=${DEVBOX_USER}-devbox"
      -out=tfplan
    - tofu apply -auto-approve tfplan
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual          # human-triggered ONLY (provisions real AWS resources)
      allow_failure: false  # operator-triggered failure fails the pipeline
  artifacts:
    # Keep the plan around on failure for post-mortem (T-be1-06 — tfplan may
    # surface SSM ARNs but not secret values; risk accepted for ops value).
    paths:
      - terraform/tfplan
    expire_in: 1 month
    when: on_failure
