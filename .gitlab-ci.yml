# =============================================================================
# .gitlab-ci.yml — devbox CI/CD: validate, bake AMI, deploy EC2.
#
# Pipeline kinds (selected via PIPELINE_KIND variable on web/schedule trigger)
#
#   PIPELINE_KIND=bake     packer build → publishes a new AMI to AWS.
#                          Trigger: Web UI ("Run pipeline" + PIPELINE_KIND=bake)
#                          OR Pipeline Schedule (Build → Pipeline schedules,
#                          set PIPELINE_KIND=bake on the schedule). Recommended
#                          schedule: weekly, to pick up upstream AL2023 CVEs.
#                          NEVER fires on push/MR (cost guardrail — packer
#                          builds spin up real EC2 instances).
#
#   PIPELINE_KIND=deploy   tofu apply → provisions an EC2 instance for one
#                          operator from the latest AMI matched by
#                          terraform/main.tf's `data "aws_ami"` filter.
#                          Trigger: Web UI ONLY. Operator MUST set
#                          DEVBOX_USER in the Run-pipeline form (no default).
#                          deploy:tofu-apply is `when: manual` on top of the
#                          web-trigger gate so a maintainer must also click
#                          "play" — defence-in-depth against operator typos.
#
#   (unset)                push and MR pipelines run validate only.
#
# Stages
#   1. validate   Up to 9 parallel gates against the source tree.
#                 Push/MR: all 9. Bake: packer-scoped (4) + cross-cutting (2).
#                 Deploy: terraform-scoped (3) + cross-cutting (2).
#                 Packer-scoped: packer-fmt, packer-validate, ansible-lint,
#                   ansible-syntax.
#                 Terraform-scoped: tofu-fmt, tofu-validate, checkov.
#                 Cross-cutting (always): shellcheck, grep-gates.
#   2. bake       packer build (PIPELINE_KIND=bake only).
#   3. deploy     tofu init -lockfile=readonly + tofu apply
#                 (PIPELINE_KIND=deploy + when: manual + protected branch).
#
# AWS authentication: GitLab OIDC federation (`id_tokens:` →
# `sts assume-role-with-web-identity`). No static IAM keys touch CI vars.
# See trust-policy block below; the IAM role binds the OIDC `sub` to a
# specific project_path + protected branch, and `aud` to this GitLab
# instance (T-be1-01).
#
# Image digest-pin policy: every `image:` line MUST be
# `name@sha256:<64-hex>`. The validate:grep-gates job's invariant #7 fails
# the pipeline if anyone regresses this (T-be1-02). To rotate a digest,
# re-resolve via `docker manifest inspect <image>:<tag>` (or
# `crane digest <image>:<tag>`) and replace the existing digest in this file.
#
# Required GitLab CI/CD variables (Settings → CI/CD → Variables)
#   AWS_ROLE_ARN     masked, protected      IAM role for OIDC AssumeRole
#   AWS_REGION       protected              e.g. us-east-1
#   TF_STATE_BUCKET  protected              S3 backend bucket
#   AWS_OIDC_AUD     protected, OPTIONAL    default: https://gitlab.com
#
# DEVBOX_USER is NOT a CI/CD variable — it's set per-run in the Run-pipeline
# form (deploy) or omitted (bake/validate). Defining it as a project CI
# variable would let an MR pipeline silently target the wrong operator.
#
# IAM Trust Policy (paste into the role AWS_ROLE_ARN resolves to)
# Replace <ACCT>, <group>, <project> with literal values. The
# `gitlab.com:sub` condition scopes the role to ONE project + main branch:
#
#   {
#     "Version": "2012-10-17",
#     "Statement": [{
#       "Effect": "Allow",
#       "Principal": { "Federated": "arn:aws:iam::<ACCT>:oidc-provider/gitlab.com" },
#       "Action": "sts:AssumeRoleWithWebIdentity",
#       "Condition": {
#         "StringEquals": { "gitlab.com:aud": "https://gitlab.com" },
#         "StringLike":   { "gitlab.com:sub": "project_path:<group>/<project>:ref_type:branch:ref:main" }
#       }
#     }]
#   }
#
# Checkov severity policy: sourced from .checkov.yaml in the repo root
# (hard-fail-on HIGH, soft-fail-on MEDIUM). DO NOT duplicate those flags
# in the job scripts — drift hazard. Every skip-check needs an inline
# justification comment per .checkov.yaml §"Policy on skip-check entries".
# =============================================================================

stages:
  - validate
  - bake
  - deploy

variables:
  PIPELINE_KIND:
    value: ""
    options:
      - ""
      - "bake"
      - "deploy"
    description: |
      Pipeline mode. Leave blank on push/MR (validate-only). Set to "bake"
      on web/schedule trigger to publish a new AMI. Set to "deploy" on web
      trigger to provision EC2 — also requires DEVBOX_USER.
  DEVBOX_USER:
    value: ""
    description: |
      Operator username. REQUIRED for PIPELINE_KIND=deploy. Threads through
      S3 state key (users/${DEVBOX_USER}/devbox.tfstate), SSH keypair name
      (${DEVBOX_USER}-devbox), security-group prefix, and SSM parameter
      prefix (/devbox/${DEVBOX_USER}/*). Must match an existing keypair
      imported per CLAUDE.md §4. Lowercase, alphanumeric + dash; no spaces.

  # IaC binary. tofu is canonical — terraform/.terraform.lock.hcl is
  # OpenTofu-flavoured per Phase 3 REP-01.
  TF_BIN: tofu

  # Backend coordinates threaded into deploy:tofu-apply. Mirrors the `./run`
  # tf-init backend logic (Phase 5: Terragrunt removed, backend driven by
  # tofu -backend-config flags).
  TF_STATE_REGION: us-east-1
  TF_STATE_LOCK_TABLE: devimage-tfstate-locks
  TF_STATE_KEY: "users/${DEVBOX_USER}/devbox.tfstate"

  # GitLab OIDC audience. Override per self-hosted GitLab instance.
  # The IAM trust-policy `gitlab.com:aud` condition MUST match this.
  AWS_OIDC_AUD: "https://gitlab.com"

# -----------------------------------------------------------------------------
# Pipeline-level gating. Decides whether a pipeline runs at all and which
# kind it is. Job-level `rules:` further restrict which jobs run inside.
# -----------------------------------------------------------------------------
workflow:
  rules:
    # Push/MR pipelines run validate only (no PIPELINE_KIND required).
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Web-triggered: must specify bake or deploy.
    - if: $CI_PIPELINE_SOURCE == "web" && $PIPELINE_KIND == "bake"
    - if: $CI_PIPELINE_SOURCE == "web" && $PIPELINE_KIND == "deploy"
    # Pipeline-schedule: bake only, protected branch only (deploy schedules
    # would provision an EC2 instance unattended on a cron — not appropriate
    # for this project; schedule on unprotected branch risks baking from
    # unreviewed code).
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "bake" && $CI_COMMIT_REF_PROTECTED == "true"
    - when: never

# -----------------------------------------------------------------------------
# Validate stage — 9 parallel gates, no `needs:` between them (each runs
# against the source tree independently). Push/MR pipelines run ALL gates.
# bake/deploy pipelines run only the gates relevant to their toolchain.
# -----------------------------------------------------------------------------

# Scope templates — validate jobs `extends:` these to limit when they run.
# Push/MR always run; bake/deploy pipelines run only the matching scope.
.rules-packer:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" && $PIPELINE_KIND == "bake"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "bake" && $CI_COMMIT_REF_PROTECTED == "true"

.rules-terraform:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" && $PIPELINE_KIND == "deploy"

# 1a. tofu fmt -check -recursive
validate:tofu-fmt:
  extends: .rules-terraform
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  script:
    - cd terraform
    - tofu fmt -check -recursive

# 1b. packer fmt -check. Split from tofu-fmt to avoid building a custom
# image that ships both binaries.
validate:packer-fmt:
  extends: .rules-packer
  stage: validate
  image: hashicorp/packer:1.15.3@sha256:cb9c526a6351c55f05430423a8b37139a04b0fb5ce541887d476e19860b5ed92
  script:
    - cd packer
    - packer fmt -check .

# 2. tofu init (lockfile-readonly) + validate. -backend=false skips S3 —
# validate does not need state access. The -lockfile=readonly flag is the
# Phase-3 REP-01 gate: CI must not silently rewrite the committed lockfile.
validate:tofu-validate:
  extends: .rules-terraform
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  script:
    - cd terraform
    - tofu init -lockfile=readonly -backend=false
    - tofu validate

# 3. packer init + validate. var.devbox_user defaults to "" since Phase 3
# fix (commit f156070); no -var flag needed.
validate:packer-validate:
  extends: .rules-packer
  stage: validate
  image: hashicorp/packer:1.15.3@sha256:cb9c526a6351c55f05430423a8b37139a04b0fb5ce541887d476e19860b5ed92
  script:
    - cd packer
    - packer init .
    - packer validate .

# 4. ansible-lint. The pipelinecomponents image ships ansible-core and
# ansible-lint preinstalled, but collections must be installed before
# lint resolves fqcn references (RESEARCH Pitfall 5).
validate:ansible-lint:
  extends: .rules-packer
  stage: validate
  image: pipelinecomponents/ansible-lint:0.26.0@sha256:e5944beda2dd60f26d71f78e595be41e3c2f2b97d0cb3a0f748943cb70659502
  script:
    - ansible-galaxy collection install -r ansible/requirements.yml
    - ansible-lint ansible/playbook.yml

# 5. ansible-playbook --syntax-check. SEPARATE job from ansible-lint —
# lint and syntax-check catch different classes of bugs and both satisfy
# CI-04 literally.
validate:ansible-syntax:
  extends: .rules-packer
  stage: validate
  image: pipelinecomponents/ansible-lint:0.26.0@sha256:e5944beda2dd60f26d71f78e595be41e3c2f2b97d0cb3a0f748943cb70659502
  script:
    - ansible-galaxy collection install -r ansible/requirements.yml
    - ansible-playbook --syntax-check ansible/playbook.yml -i localhost,

# 6. shellcheck on every script in scripts/.
validate:shellcheck:
  stage: validate
  image: koalaman/shellcheck-alpine:v0.10.0@sha256:7c6a5115899d99323b22fc84b29e924aef5b6fa985612e450a8c356969ebb577
  script:
    - shellcheck scripts/*.sh run

# 7. Checkov against terraform/. --hard-fail-on HIGH and --soft-fail-on
# MEDIUM are sourced from .checkov.yaml — do NOT re-specify them on the
# command line (drift hazard, see .checkov.yaml header).
validate:checkov:
  extends: .rules-terraform
  stage: validate
  image: bridgecrew/checkov:3.2.527@sha256:22b308dd96e158b446c6080d19ea41ffb609ebd46962c9ace43b9b6c8aaff5cf
  script:
    - checkov --directory terraform/ --framework terraform --config-file .checkov.yaml

# 8. grep-gates. Phase-3 + CI-hardening invariants enforced as a single
# job. Invariant #4 (collection-version pin) uses the comment-filtered
# form: '"==X.Y.Z"' starts with '"' (not '='), so an unfiltered grep on
# `version:` lines without `==` would self-invalidate against legal pins.
#
# Re-uses the opentofu image (already digest-pinned above) since it has
# bash + grep + git — no separate digest to rotate.
validate:grep-gates:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  script:
    - |
      set -euo pipefail

      # 1. Source AMI must not use most_recent=true (REP-04)
      ! grep -rE 'most_recent[[:space:]]*=[[:space:]]*true' packer/

      # 2. No hand-copied AMI ID in terraform.tfvars (REP-05; previously
      #    terragrunt.hcl, removed Phase 5 — the file is gone, the
      #    invariant moved with the inputs)
      ! grep -E '^[[:space:]]*ami_id[[:space:]]*=[[:space:]]*"ami-' terraform/terraform.tfvars

      # 3. No raw <RESOLVED-VERSION> placeholder (REP-06)
      ! grep -r -- '<RESOLVED-VERSION>' packer/

      # 4. No bare collection-version pins (REP-02)
      #    Get non-comment lines that start with 'version:' and whose
      #    value does NOT begin with '==' (quoted or unquoted).
      if grep -vE '^[[:space:]]*#' ansible/requirements.yml \
           | grep -E '^[[:space:]]*version:' \
           | grep -vE 'version:[[:space:]]*"?==' ; then
        echo "FAIL: bare-version pin found in ansible/requirements.yml (REP-02)" >&2
        exit 1
      fi

      # 5. Terraform lockfile is tracked (REP-01)
      git ls-files terraform/.terraform.lock.hcl | grep -q .

      # 6. Lockfile-exclusion not in .gitignore (REP-01 defense)
      ! grep -E '^[^#]*terraform/\.terraform\.lock\.hcl' .gitignore

      # 7. GitLab CI image digest-pin policy.
      #    Every `image:` line in .gitlab-ci.yml MUST be `name@sha256:HEX`.
      #    T-be1-02 mitigation.
      if grep -E '^[[:space:]]*image:[[:space:]]+' .gitlab-ci.yml \
           | grep -v '@sha256:' ; then
        echo "FAIL: unpinned image: line in .gitlab-ci.yml (must use @sha256:HEX)" >&2
        exit 1
      fi

      # 8. run file must have executable bit in git (RUN-07 / CI-04)
      git ls-files -s run | grep -q '^100755' || {
        echo "FAIL: run file does not have executable bit in git (must be 100755)" >&2
        exit 1
      }

      # 9. No retired `make <target>` invocations in tracked files (Phase 7 —
      #    Makefile deleted; operator surface is `./run`). Scoped to the former
      #    Makefile target names so the genuine `make -j` C++ build in
      #    ansible/roles/devtools and English prose are not flagged.
      if git grep -nE '\bmake (build|validate|fmt|packer-init|tf-[a-z-]+|start|stop|status|devbox-[a-z-]+|secrets-show|clean|doctor|help)\b' -- ':!.planning' ; then
        echo "FAIL: retired 'make <target>' invocation found (Makefile deleted in Phase 7 — use ./run)" >&2
        exit 1
      fi

      echo "All 9 invariants pass."

# -----------------------------------------------------------------------------
# .aws-auth template — hidden job (leading dot prefix → GitLab never runs it
# directly). bake:packer-build + deploy:tofu-apply `extends:` this to inherit
# the id_tokens + sts assume-role-with-web-identity before_script.
#
# Threat model linkage:
#   T-be1-01 (Spoofing): the IAM trust policy in the header MUST scope `sub`
#     (project_path + ref_type + ref) AND `aud` (matching AWS_OIDC_AUD). Without
#     both conditions, any GitLab project on the same instance could request a
#     token and assume the role.
#   T-be1-04 (Repudiation): --role-session-name embeds CI_PROJECT_ID +
#     CI_PIPELINE_ID + CI_JOB_ID so CloudTrail records which pipeline/job
#     triggered each AWS API call.
#   T-be1-05 (Info disclosure): AWS_ROLE_ARN is configured as a Masked +
#     Protected GitLab variable, so it never appears in job logs.
# -----------------------------------------------------------------------------

.aws-auth:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: ${AWS_OIDC_AUD}
  before_script:
    # Smoke test: the inheriting job's `image:` must already ship aws-cli + jq.
    # The opentofu and packer images don't ship aws-cli; install if Alpine,
    # else fail loud so the operator picks a better base image.
    - |
      if ! command -v aws >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache aws-cli jq
        else
          echo "FATAL: image is missing aws-cli or jq, and is not Alpine (no apk). Use an image that ships them or override the image:." >&2
          exit 1
        fi
      fi
    - >
      creds=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gl-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$creds" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "$creds" | awk '{print $3}')
    # Smoke test: fail loudly on bad role / aud / sub. The account-ID printed
    # here is low-sensitivity (it's already in TF_STATE_BUCKET — see T-be1-05).
    - aws sts get-caller-identity

# -----------------------------------------------------------------------------
# Bake stage — packer build (PIPELINE_KIND=bake only).
#
# Produces a new AMI in AWS. No artifact handoff — deploy picks the latest
# matching AMI via terraform/main.tf's `data "aws_ami"` filter on the next
# `tofu apply`.
#
# PKR_VAR_aws_region threads the CI AWS_REGION variable through to Packer
# via Packer's PKR_VAR_* env-var convention. devbox_user defaults to "" in
# variables.pkr.hcl — no override needed (bake produces an AMI shared
# across operators; per-operator wiring happens at deploy time).
#
# Trigger paths:
#   - Web UI: "Run pipeline" with PIPELINE_KIND=bake (operator-initiated).
#   - Pipeline Schedule: configure once in Build → Pipeline schedules with
#     PIPELINE_KIND=bake (recommended weekly to catch AL2023 CVEs).
#
# Cost guardrail: bake spins up a real EC2 instance for ~10-15 min during
# the Packer build. NEVER fires on push/MR (workflow:rules above).
# -----------------------------------------------------------------------------

bake:packer-build:
  stage: bake
  extends: .aws-auth
  image: hashicorp/packer:1.15.3@sha256:cb9c526a6351c55f05430423a8b37139a04b0fb5ce541887d476e19860b5ed92
  variables:
    PKR_VAR_aws_region: ${AWS_REGION}
  script:
    - ./run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $PIPELINE_KIND == "bake" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "bake" && $CI_COMMIT_REF_PROTECTED == "true"

# -----------------------------------------------------------------------------
# Deploy stage — tofu apply (PIPELINE_KIND=deploy + manual only).
#
# Picks the latest AMI matched by the `data "aws_ami"` filter in
# terraform/main.tf and provisions a per-operator EC2 instance.
#
# Plan-file workflow dropped in favour of `./run tf-auto-apply` — simpler,
# and defense-in-depth is sufficient without the plan artifact:
# `when: manual` gate + protected branch + OIDC scoped to project/branch
# + DEVBOX_USER fail-fast in before_script.
#
# `./run tf-init` auto-adds `-lockfile=readonly` when CI=true (Phase 3
# REP-01). Backend-config and -var args are derived from env vars by
# `./run` internally (_tf_backend_args, _tf_var_args).
#
# `when: manual` blocks this job until a maintainer clicks "play" in the
# GitLab UI on a protected branch. Combined with PIPELINE_KIND=deploy and
# protected-branch gating, the deploy is gated on (a) operator chose deploy
# in the Run-pipeline form, (b) on a protected branch, (c) a maintainer
# also clicked play, (d) the operator has deploy permission, (e) the
# DEVBOX_USER fail-fast in before_script passed. T-be1-10 mitigation.
# -----------------------------------------------------------------------------

deploy:tofu-apply:
  stage: deploy
  extends: .aws-auth
  image: ghcr.io/opentofu/opentofu:1.10.6@sha256:43f73c1e01f21de343ca4428a7e1845a357790235c73758bd7dc3cc4d1324b49
  environment:
    name: devbox/${DEVBOX_USER}
  before_script:
    # DEVBOX_USER fail-fast. Must run BEFORE .aws-auth's before_script
    # so we don't waste an STS AssumeRole on a bad input. `extends:`
    # OVERRIDES before_script (does not concatenate); the `!reference`
    # tag below explicitly inserts .aws-auth's before_script after this.
    - |
      if [ -z "${DEVBOX_USER:-}" ]; then
        echo "FATAL: DEVBOX_USER is required for PIPELINE_KIND=deploy." >&2
        echo "Set it in the Run-pipeline form (lowercase, alphanumeric + dash)." >&2
        exit 1
      fi
      if ! printf '%s' "$DEVBOX_USER" | grep -qE '^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$'; then
        echo "FATAL: DEVBOX_USER='${DEVBOX_USER}' violates the per-operator naming convention." >&2
        echo "Must be lowercase, alphanumeric + dash, 2-32 chars, no leading/trailing dash." >&2
        exit 1
      fi
      echo "Deploying for DEVBOX_USER=${DEVBOX_USER}"
    # !reference inserts the .aws-auth before_script after the fail-fast above.
    - !reference [.aws-auth, before_script]
  script:
    - ./run tf-init
    - ./run tf-auto-apply
    # Give the freshly-created EC2 time to build before the job ends.
    - sleep 120
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $PIPELINE_KIND == "deploy" && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: false  # operator-triggered failure fails the pipeline
